name: Validate content data

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run content validation
        run: node scripts/validate-posts.js

      # 仅在 push 到 main 时自动重建 RSS 订阅源并回写仓库
      - name: Generate RSS feed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/generate-rss.js

      - name: Commit rss.xml if changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain rss.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rss.xml
            git commit -m "chore: 自动更新 rss.xml [skip ci]"
            git push
          else
            echo "rss.xml 无变化，跳过提交。"
          fi
