## 高级排版

- <b>加粗</b>强调关键内容
- <i>倾斜</i>表达语气变化
- H<sub>2</sub>O 与 X<sup>3</sup> 展示上下标
- <spacing=3>宽字符间距效果</spacing>
- <lh=2>更大的行距让段落呼吸</lh>
