> 这是一段 Markdown 引用块：连续多行以 > 开头即可合并为引用样式，
> 行内仍可混用 <b>加粗</b>、<color=#22C55E>颜色</color> 等富文本标签。

| 功能 | 语法 | 状态 |
| :--- | :---: | ---: |
| 引用块 | > 文本 | 已支持 |
| 表格 | 竖线 + 分隔行 | 已支持 |
| 代码块 | 三反引号围栏 | 已支持 |

\`\`\`js

  const msg = '你好, ' + name;
  console.log(msg);
}
