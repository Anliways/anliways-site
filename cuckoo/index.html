      <button class="ic-btn" data-edit="${r.id}" title="编辑">${ICON_EDIT}</button>
      <button class="ic-btn danger" data-del="${r.id}" title="删除">${ICON_TRASH}</button>
    </div>`;
  };
  const repeatOptions = Object.keys(REPEATS).map(k=>'<option value="'+k+'">'+REPEATS[k]+'</option>').join('');
  openModal(`<h3>提醒管理<span class="x">×</span></h3>
    <div id="remList">${list.length? list.map(item).join('') : '<div class="kempty">还没有提醒，点下面「添加提醒」写一条</div>'}</div>
    <hr style="border:none;border-top:1px solid var(--border);margin:14px 0">
    <div class="field"><label>新增提醒内容</label><input id="rText" placeholder="例如：提交月报"></div>
    <div style="display:flex;gap:8px">
      <div class="field" style="flex:1.2"><label>日期</label><input id="rDate" type="date" value="${today}"></div>
      <div class="field" style="flex:1"><label>时间（可选）</label><input id="rTime" type="time"></div>
      <div class="field" style="flex:1"><label>重复</label><select id="rRepeat"><option value="none">不重复</option>${repeatOptions}</select></div>
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="addReminder()">添加提醒</button>
    <div class="hint">填了时间则到点时提醒（需页面保持打开）；只填日期则进入当天的汇总通知。重复提醒完成后自动顺延到下一期。顶栏显示最近 3 条未完成提醒，逾期/已到点标红。</div>`);
  $('#remList').querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>toggleRem(b.dataset.done));
  $('#remList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editReminder(b.dataset.edit));
  $('#remList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delReminder(b.dataset.del));
}
const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
/* ---------- 自然语言快速录入：「明天早上9点交房租」→ {title:'交房租', date:明天, time:'09:00'} ---------- */
const NL_WEEK={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0};
const pad2=n=>String(n).padStart(2,'0');
function parseNL(text){
  let t=(text||'').trim(); if(!t) return null;
  let date=null, time='', repeat='none', matched=false;
  const today=new Date(), base=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  // 重复规则（每周X/每月X号 把「周/月」留在原文里，交给后面的星期/日期分支解析具体日子）
  if(/每[天日]/.test(t)){ repeat='daily'; t=t.replace(/每[天日][，,、]*/,''); matched=true; }
  else if(/每周/.test(t)){ repeat='weekly'; t=t.replace(/每周[，,、]*/,'周'); matched=true; }
  else if(/每月/.test(t)){ repeat='monthly'; t=t.replace(/每月[，,、]*/,''); matched=true; }
  // X月X号/日（今年已过则推到明年）
  let m=t.match(/(\d{1,2})月(\d{1,2})[日号]/);
  if(m){
    const mo=+m[1]-1, dy=+m[2];
    let d=new Date(today.getFullYear(),mo,dy);
    if(d<base) d=new Date(today.getFullYear()+1,mo,dy);
    if(mo>=0&&mo<12&&dy>=1&&dy<=31){ date=fmtDate(d); t=t.replace(m[0],''); matched=true; }
  }
  // X号/日（当月，已过则下月）
  if(!date){
    m=t.match(/(\d{1,2})[日号]/);
    if(m){ const dy=+m[1];
      if(dy>=1&&dy<=31){
        let d=new Date(today.getFullYear(),today.getMonth(),dy);
        if(d<base) d=new Date(today.getFullYear(),today.getMonth()+1,dy);
        date=fmtDate(d); t=t.replace(m[0],''); matched=true;
      }
    }
  }
  // 周X / 星期X / 下周X / 下下周X
  if(!date){
    m=t.match(/(下下|下)?(?:周|星期)([一二三四五六日天])/);
    if(m){ const w=NL_WEEK[m[2]];
      let diff=(w-today.getDay()+7)%7; if(diff===0) diff=7;
      if(m[1]) diff+=7*(m[1]==='下下'?2:1);
      const d=new Date(); d.setDate(d.getDate()+diff);
      date=fmtDate(d); t=t.replace(m[0],''); matched=true;
    }
  }
  // 今天 / 明天 / 后天 / 大后天
  if(!date){
    if(/大后天/.test(t)){ date=shiftDay(3); t=t.replace('大后天',''); matched=true; }
    else if(/后天/.test(t)){ date=shiftDay(2); t=t.replace('后天',''); matched=true; }
    else if(/明天/.test(t)){ date=shiftDay(1); t=t.replace('明天',''); matched=true; }
    else if(/今晚|今天/.test(t)){ date=todayStr(); t=t.replace(/今晚|今天/,''); matched=true; }
  }
  // 时间：早上9点 / 下午3点半 / 晚8点一刻 / 18:30 / 9点45分
  m=t.match(/(凌晨|早上|早晨|上午|中午|下午|傍晚|晚上|夜里|早|晚)?\s*(\d{1,2})[点时:：]\s*(半|一刻|三刻|(\d{1,2})\s*分?)?/);
  if(m){
    let h=+m[2], min=0; const seg=m[1]||'';
    if(m[3]==='半') min=30; else if(m[3]==='一刻') min=15; else if(m[3]==='三刻') min=45; else if(m[4]) min=+m[4];
    if(/下午|晚上|傍晚|夜里|晚/.test(seg) && h<12) h+=12;
    else if(/上午|早上|早晨|早/.test(seg) && h===12) h=0;
    if(h>=0&&h<24&&min>=0&&min<60){ time=pad2(h)+':'+pad2(min); t=t.replace(m[0],''); matched=true; }
  }
  // 中文数字时间：下午两点 / 两点半 / 十二点一刻
  if(!time){
    const CN_NUM={'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
    m=t.match(/(凌晨|早上|早晨|上午|中午|下午|傍晚|晚上|夜里|早|晚)?\s*(十[一二]?|[一二两三四五六七八九])\s*[点时]\s*(半|一刻|三刻)?/);
    if(m){
      const cs=m[2]; // 「十」=10，「十一/十二」=11/12，其余单字直查
      let h= cs==='十'? 10 : cs.length===2? 10+CN_NUM[cs[1]] : CN_NUM[cs];
      let min=0; const seg=m[1]||'';
      if(m[3]==='半') min=30; else if(m[3]==='一刻') min=15; else if(m[3]==='三刻') min=45;
      if(/下午|晚上|傍晚|夜里|晚/.test(seg) && h<12) h+=12;
      else if(/上午|早上|早晨|早/.test(seg) && h===12) h=0;
      else if(!seg && h>=1 && h<=6) h+=12; // 无时段修饰的「两点半」按下午理解
      if(h>=0&&h<24){ time=pad2(h)+':'+pad2(min); t=t.replace(m[0],''); matched=true; }
    }
  }
  // 「中午」单独出现（后面没有数字）：按 12:00 处理
  if(!time && /中午/.test(t)){ time='12:00'; t=t.replace('中午',''); matched=true; }
  t=t.replace(/^[，,、。\s]+/,'').replace(/[，,、。\s]+$/,'');
  if(!t) return null;
  return {title:t, date, time, repeat, matched};
}
// 在「提醒管理」中识别输入：自动回填日期/时间/重复字段，标题只留纯内容
function nlApplyReminder(){
  const parsed=parseNL($('#rText').value);
  if(!parsed) return;
  $('#rText').value=parsed.title;
  if(parsed.date) $('#rDate').value=parsed.date;
  if(parsed.time) $('#rTime').value=parsed.time;
  const sel=$('#rRepeat'); if(sel && parsed.repeat!=='none') sel.value=parsed.repeat;
  const parts=[];
  if(parsed.date) parts.push(relDay(parsed.date));
  if(parsed.time) parts.push(parsed.time);
  if(parsed.repeat!=='none') parts.push(REPEATS[parsed.repeat]);
  if(parts.length) toast('已识别：'+parts.join(' '));
}
function addReminder(){
  nlApplyReminder(); // 先做自然语言识别回填，再按字段值入库
  const text=$('#rText').value.trim(); if(!text){ toast('请输入提醒内容'); return; }
  const time=$('#rTime').value.trim();
  if(time && !TIME_RE.test(time)){ toast('时间格式不正确'); return; }
  const repeat=$('#rRepeat')? $('#rRepeat').value : 'none';
  if(!['none','daily','weekly','monthly'].includes(repeat)){ toast('重复规则无效'); return; }
  const list=ls.get('reminders',[]);
  list.push({id:rid(), text, date:$('#rDate').value||todayStr(), time:time||'', repeat, done:false});
  ls.set('reminders',list); renderReminders();
  $('#rText').value=''; $('#rDate').value=todayStr(); $('#rTime').value=''; openReminderManager();
}
// 重复提醒的「完成」= 顺延到下一期（保持未完成状态）；普通提醒按原逻辑切换 done
function completeReminder(id){
  const list=ls.get('reminders',[]); const r=list.find(x=>x.id===id);
  if(r && r.repeat && r.repeat!=='none'){
    r.date = nextOccur(effRemDate(r, todayStr()), r.repeat);
    ls.set('reminders',list); renderReminders();
    toast('已完成，下次提醒 '+fmtMD(r.date)+(r.time? ' '+r.time:''));
    return;
  }
  toggleDone('reminders', id, renderReminders);
}
function toggleRem(id){ completeReminder(id); // 仅当「提醒管理」弹窗已打开时刷新它，避免从顶栏勾选时误弹窗
  if($('#overlay').classList.contains('show') && $('#remList')) openReminderManager(); }
function editReminder(id){
  const r=ls.get('reminders',[]).find(x=>x.id===id); if(!r)return;
  formModal({
    title:'编辑提醒', saveText:'保存',
    fields:[
      {id:'erText', label:'提醒内容', value:r.text},
      {id:'erDate', label:'日期', type:'date', value:r.date},
      {id:'erTime', label:'时间（留空为全天）', type:'time', value:r.time||''},
      {id:'erRepeat', label:'重复', type:'select', value:r.repeat||'none',
        options:[{value:'none',name:'不重复'},{value:'daily',name:'每天'},{value:'weekly',name:'每周'},{value:'monthly',name:'每月'}]}
    ],
    onSave:([text,date,time,repeat])=>{
      if(!text.trim()){ toast('提醒内容不能为空'); return false; }
      if(time && !TIME_RE.test(time)){ toast('时间格式不正确'); return false; }
      if(!['none','daily','weekly','monthly'].includes(repeat)){ toast('重复规则无效'); return false; }
      const list=ls.get('reminders',[]); const it=list.find(x=>x.id===id);
      if(it){ it.text=text.trim(); it.date=date||it.date; it.time=time||''; it.repeat=repeat; }
      ls.set('reminders',list); renderReminders(); openReminderManager();
    }
  });
}
function delReminder(id){
  const r=ls.get('reminders',[]).find(x=>x.id===id);
  if(!r) return;
  removeWithUndo('reminders', r, {
    label:'提醒', rerender:renderReminders,
    afterDelete:openReminderManager, // 删除来源是管理弹窗，保持弹窗刷新
    afterRestore:()=>{ if($('#overlay').classList.contains('show') && $('#remList')) openReminderManager(); }
  });
}

/* ---------- 邮箱采集：账户绑定 / 管理 / 采集 ---------- */
function openMailAccounts(){
  const list = ls.get('mail_accounts',[]);
  const maskCred = c => c? '····'+String(c).replace(/\s+/g,'').slice(-4) : '未设置';
  const rows = list.length? list.map(a=>{
    const p = MAIL_PROVIDERS[a.provider]||{name:a.provider};
    return `<div class="hist-item ac-row">
      <span class="ac-badge">${esc(p.name)}</span>
      <span class="ac-mail" title="${esc(a.email)}（${esc(p.host||'')}）">${esc(a.email)}</span>
      <span class="ac-badge" style="color:var(--muted);background:var(--soft)" title="凭证已脱敏显示">凭证 ${esc(maskCred(a.credential))}</span>
      <button class="ic-btn" data-collect="${a.id}" title="采集该账户邮件">${ICON_SEARCH}</button>
      <button class="ic-btn danger" data-del="${a.id}" title="解绑">${ICON_TRASH}</button>
    </div>`;
  }).join('') : '<div class="kempty">尚未绑定邮箱账户</div>';
  openModal(`<h3>邮箱采集<span class="x">×</span></h3>
    <div class="hint">绑定后点「采集」就能把邮件拉进来。浏览器不能直连邮箱，需要在「设置 → 收件箱」里填一个中转接口（进阶用法；不会配置也可以先用其他功能）。</div>
    <div class="hint" style="color:var(--warn)">安全提示：授权凭证以明文保存在本机浏览器（localStorage），请勿在共用电脑上绑定账户；导出备份 JSON 时会包含凭证，请妥善保管备份文件。</div>
    <div style="margin:10px 0;display:flex;flex-direction:column;gap:6px">${rows}</div>
    <div class="data-row"><button class="btn btn-primary" style="flex:1" data-add>+ 添加邮箱账户</button><button class="btn" style="flex:1" data-collect-all>采集全部账户</button></div>`);
  $('#drawer [data-add]').onclick=()=>addMailAccount();

async function collectMailAccount(id, silent){
  const a = ls.get('mail_accounts',[]).find(x=>x.id===id); if(!a) return 0;
  const cfg = ls.get('config',{}).emailApi||{};
  if(!cfg.url){ if(!silent) toast('请先在设置中配置「邮件列表 API」', 3500); return 0; }
  const p = MAIL_PROVIDERS[a.provider]||{};
  try{
    const res = await apiFetch(cfg, {headers:{'X-Mail-Account': JSON.stringify({provider:a.provider, email:a.email, host:p.host||'', port:p.port||993, credential:a.credential})}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j = await res.json();
    const arr = Array.isArray(j)? j : (j.emails||j.data||j.list||[]);
    const list = arr.map(e=>({id:e.id||e.message_id||rid(), from:e.from||e.sender||'未知', subject:e.subject||e.title||'(无主题)', date:e.date||e.time||e.received_at||'', snippet:e.snippet||e.preview||(e.body?String(e.body).slice(0,80):''), body:e.body||e.content||'', via:p.name||a.provider}));
    if(list.length){
      const cache = ls.get('email_cache',[]);
      const seen = new Set(cache.map(m=>m.id));
      cache.push(...list.filter(m=>!seen.has(m.id)));
      ls.set('email_cache',cache);
    }
    if(!silent){ toast(list.length? '已采集 '+list.length+' 封邮件（'+a.email+'）':'该账户暂无新邮件'); renderMail(false); }
    return list.length;
  }catch(e){ if(!silent) toast('采集失败：'+apiErrMsg(e), 3500); return 0; }
}
async function collectAllAccounts(){
  const list = ls.get('mail_accounts',[]);

  const cfg = ls.get('config',{}).emailApi||{};

}

/* ---------- 桌面通知 ---------- */
// 1) 每日汇总：打开页面时推送一次（今日 + 逾期）
// 2) 到点提醒：每 30s 检查今日已设置时间的未完成提醒，到点即推（当天去重，含刷新后）
function enableNotify(){
  if(!('Notification' in window)){ toast('当前浏览器不支持桌面通知'); return; }
  Notification.requestPermission().then(p=>{
    if(p==='granted'){ toast('已开启桌面通知'); pushReminderNotification(true); }
    else toast('未获得通知权限，可在浏览器站点设置中开启', 3500);
  }).catch(()=>toast('请求通知权限失败', 3000));
}
function pushReminderNotification(force){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const today=todayStr();
  const open=ls.get('reminders',[]).filter(r=>!r.done && (effRemDate(r,today)||'')<=today);
  if(!open.length) return;
  if(!force && ls.get('notified_on','')===today) return; // 每天只推一次
  ls.set('notified_on', today);
  try{
    new Notification('Cuckoo 工作台 · 今日 '+open.length+' 条提醒', {
      tag:'cuckoo-reminders-'+today,
      body: open.slice(0,3).map(r=>((effRemDate(r,today)||'')<today?'[逾期] ':'')+(r.time?'('+r.time+') ':'')+r.text).join('\n')
    });
  }catch(e){}
}
const dueNotified = new Set(); // 本会话已推送的到点提醒键（id@日期 时间）
function fireDueNotification(due){
  const body = due.map(r=>(r.time? r.time+' ' : '')+r.text).join('\n');
  if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification('Cuckoo · 提醒时间到', {tag:'cuckoo-due-'+Date.now(), body}); }catch(e){}
  }
  // 不依赖系统通知权限：页面内浮层 + 标题闪动，保证「时间到」一定被看见
  showDueBanner(due);
  startTitleFlash();
  toast('【提醒时间到】'+due[0].text+(due.length>1?'（等 '+due.length+' 条）':''), 6000);
}
function startDueTicker(){
  // 恢复当天已推送记录，避免刷新后重复提醒
  ls.get('notified_due', []).forEach(k=>{ if(k.startsWith(todayStr()+' ')) dueNotified.add(k); });
  const tick = ()=>{
    const today=todayStr(), hhmm=remHHMM(), now=Date.now();
    // 「+10 分钟」的稍后提醒：到点前跳过，到点后自动恢复推送
    const sn=ls.get('snooze_due',{});
    let changed=false;
    Object.keys(sn).forEach(k=>{ if(!(sn[k]>now)){ delete sn[k]; changed=true; } });
    if(changed) ls.set('snooze_due', sn);
    const due = ls.get('reminders',[]).filter(r=>{
      const ed = effRemDate(r, today);
      const key = r.id+'@'+today+' '+r.time;
      return !r.done && r.time && TIME_RE.test(r.time) && ed===today && r.time<=hhmm && !dueNotified.has(key) && !sn[r.id];
    });
    if(!due.length) return;
    due.forEach(r=>dueNotified.add(r.id+'@'+today+' '+r.time));
    ls.set('notified_due', [...dueNotified].slice(-200));
    fireDueNotification(due);
    renderReminders(); // 到点后顶栏状态变为「已到点」标红
  };
  tick();
  setInterval(tick, 30000);
}

// SDK 为 defer 加载，回调处理须待其初始化完成后执行（DOMContentLoaded 晚于 defer 脚本）
async function handleOAuthCallback(){
  initCloud();
  if(!cloud) return;
  try{
    const url=new URL(location.href);
    if(!url.searchParams.has('code') && !url.searchParams.has('error')) return;
    if(url.searchParams.get('provider')!=='wechat' || typeof cloud.auth.handleWechatWebCallback!=='function') return;
    const done=await cloud.auth.handleWechatWebCallback.call(cloud.auth);
    if(done && done.error){ toast('登录失败：'+cloudErrMsg(done.error),4000); return; }
    if(done && done.data){
      ['code','state','provider'].forEach(k=>url.searchParams.delete(k));
      history.replaceState(null,'',url.pathname+url.search+url.hash);
      toast('微信登录成功，可以备份了');
      setTimeout(()=>{ if(!$('#overlay').classList.contains('show')) openAccount(); },300);
    }
  }catch(e){ console.warn('[cuckoo] OAuth 回调处理异常', e && e.message); }
}
document.addEventListener('DOMContentLoaded', ()=>{ initCloud(); handleOAuthCallback(); });

  if(!model){ out.innerHTML='<span class="muted-tip" style="border:none;background:transparent;padding:0">当前没有可用的试用模型，可在「设置」里填自己的 API。</span>'; throw new Error('__demo__'); }
  out.textContent='';
  let ans='';
  try{
    for await (const chunk of cloud.llm.chat.completions.create({
      model: model.id,
      messages: [{role:'system', content:AI_SYSTEM}, {role:'user', content:q}],
      stream: true,
      stream_options: {include_usage:true},
      temperature: 0.7
    })){
      const d = chunk.choices && chunk.choices[0] && chunk.choices[0].delta && chunk.choices[0].delta.content;
      if(d){ ans+=d; out.textContent=ans; }
    }
  }catch(e){
    const code = (e && e.error && e.error.code) || '';
    if(ans){ out.textContent = ans+'\n\n[响应中断]'; toast('生成中断，已保留部分结果'); return ans; }
    if(code.indexOf('auth_')===0){ out.innerHTML = trialBlockedHTML('这个网址还没拿到 AI 试用授权（或登录已过期）。到完整版登录后再试，或在设置里填自己的 API。')+' <button class="btn btn-sm" onclick="location.href=\''+CANONICAL_URL+'\'">去完整版</button>'; }
    else if(code.indexOf('quota_')===0){ out.innerHTML = trialBlockedHTML('试用额度刚好用完了，明天再来，或在设置里填自己的 API。', true); }
    else if(code.indexOf('gateway_')===0 || code.indexOf('model_')===0){ out.innerHTML = trialBlockedHTML('模型服务打了个盹，稍等几秒再点一次。'); }
    else { out.innerHTML = trialBlockedHTML('没生成成功：'+((e&&e.error&&e.error.message)||(e&&e.message)||'网络异常')+'。可再试一次，或在设置里填自己的 API。'); }
    throw new Error('__demo__');
  }
  if(!ans){ out.innerHTML = trialBlockedHTML('这次没生成内容，换个说法再试试。'); throw new Error('__demo__'); }
  return ans;
}

/* ---------- 今日焦点：一眼看到今天，点一下就到对应位置 ---------- */
function renderFocus(){
  const meta=$('#fbMeta'), title=$('#fbTitle');
  if(!meta) return;
  const today=todayStr(), hhmm=remHHMM();
  const tasks=ls.get('daily_tasks',[]).filter(t=>t.date===today);
  const done=tasks.filter(t=>t.done).length;
  const open=ls.get('reminders',[]).filter(r=>!r.done);
  const overdue=open.filter(r=>remOverdue(r,today,hhmm)).length;
  const next=open.map(r=>({r, ed:effRemDate(r,today)||''}))
    .filter(x=>x.ed && x.ed>=today)
    .sort((a,b)=>((a.ed+' '+(a.r.time||'23:59')).localeCompare(b.ed+' '+(b.r.time||'23:59'))))[0];
  const st=weeklyStats();
  const chips=[];
  if(tasks.length) chips.push('<span class="fb-chip" data-goto="daily">今天 '+done+'/'+tasks.length+' 件</span>');
  if(next){
    const when = next.ed===today? (next.r.time||'全天') : relDay(next.ed)+(next.r.time? ' '+next.r.time:'');
    chips.push('<span class="fb-chip" data-goto="daily">下一条 + '+esc(when)+' · '+esc(truncStr(next.r.text,10))+'</span>');
  }
  if(overdue) chips.push('<span class="fb-chip hot" data-goto="rem">逾期 '+overdue+'</span>');
  if(st.streak>0) chips.push('<span class="fb-chip fire" data-goto="daily">🔥 连续 '+st.streak+' 天</span>');
  if(!chips.length) chips.push('<span class="fb-chip plain">还没有安排，右边记一笔就行</span>');
  meta.innerHTML=chips.join('');
  if(title) title.textContent = (tasks.length && done===tasks.length)? '今天清空了' : '今天';
  meta.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>{
    if(el.dataset.goto==='rem') openReminderManager();
    else $('#dailyCard').scrollIntoView({behavior:'smooth', block:'start'});
  });
}

function exportJSON(){
  const data={};
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(PREFIX)){ try{ data[k]=JSON.parse(localStorage.getItem(k)); }catch(e){ data[k]=localStorage.getItem(k); } } }
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='cuckoo-backup-'+todayStr()+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000); closeModal();
}
function importJSON(){ $('#importFile').click(); }
function doImport(e){ const f=e.target.files[0]; if(!f)return;
  if(f.size > LIMITS.importMaxBytes){ toast('文件过大（超过 '+Math.round(LIMITS.importMaxBytes/1048576)+'MB），导入已取消', 3500); return; }
  const r=new FileReader();
  r.onload=()=>{
    let obj;
    try{ obj=JSON.parse(r.result); }catch(err){ toast('导入失败：文件不是合法 JSON', 3500); return; }
    if(typeof obj!=='object'||obj===null){ toast('导入失败：文件内容格式不支持', 3500); return; }
    const entries=Object.keys(obj).filter(k=>k.startsWith(PREFIX)).map(k=>[k, typeof obj[k]==='string'?obj[k]:JSON.stringify(obj[k])]);
    const snapKeys=Object.keys(localStorage).filter(k=>k.startsWith(PREFIX));
    const snap={}; snapKeys.forEach(k=>snap[k]=localStorage.getItem(k));
    try{ entries.forEach(([k,v])=>localStorage.setItem(k,v)); }
    catch(err){
      snapKeys.forEach(k=>localStorage.setItem(k, snap[k]));
      Object.keys(localStorage).filter(k=>k.startsWith(PREFIX) && !(k in snap)).forEach(k=>localStorage.removeItem(k));
      toast('导入失败：存储空间不足或无权写入，已撤销本次导入', 3500); return;
    }
    toast('导入成功，正在刷新…', 2000); closeModal(); location.reload();
  };
  r.onerror=()=>{ toast('导入失败：文件读取错误', 3500); };
  r.readAsText(f);
}

function showToast(o){
  const t=document.createElement('div'); t.className='toast';
  const s=document.createElement('span'); s.className='t-msg'; s.textContent=o.msg; t.appendChild(s);
  const timer=setTimeout(()=>t.remove(), o.ms||1600);
  if(o.action){
    const b=document.createElement('button'); b.textContent=o.action;
    b.onclick=()=>{ clearTimeout(timer); t.remove(); if(o.onAction) o.onAction(); };
    t.appendChild(b);
  }
  document.body.appendChild(t);
}
function toast(msg, ms){ showToast({msg, ms}); }
// 带撤销按钮的 toast：5 秒内可点击撤销，回调执行恢复动作
function toastUndo(msg, onAction){ showToast({msg, action:'撤销', onAction, ms:5000}); }
// 自定义确认弹窗：替代原生 confirm，风格与全站一致；opts: {title, okText, danger(false=主色确定键)}
function uiConfirm(msg, onOk, opts){
  opts=opts||{};
  openModal('<h3>'+esc(opts.title||'确认操作')+'<span class="x">×</span></h3>'
    +'<div style="font-size:14px;line-height:1.6;margin-bottom:16px">'+esc(msg)+'</div>'
    +'<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">'
    +'<button class="btn" data-cancel>取消</button>'
    +'<button class="btn '+(opts.danger===false?'btn-primary':'btn-danger')+'" data-ok>'+esc(opts.okText||'确定')+'</button></div>', true);
  $('#drawer [data-cancel]').onclick=closeModal;
  $('#drawer [data-ok]').onclick=()=>{ closeModal(); if(onOk) onOk(); };
}
// 通用「确认删除 + 5 秒可撤销」：删除按 match 谓词定位，撤销按原索引回插。
// opts: {label(名称前缀), match(x)(可选，默认按 id 匹配), rerender(), afterDelete(), afterRestore()}
function removeWithUndo(listKey, item, opts){
  opts=opts||{};
  const match = opts.match || (x=>x.id===item.id);
  const name = item.title||item.text||item.from||'';
  const idx = ls.get(listKey,[]).findIndex(match);
  if(idx<0) return;
  const doRemove=()=>{
    ls.set(listKey, ls.get(listKey,[]).filter(x=>!match(x)));
    if(opts.rerender) opts.rerender();
    if(opts.afterDelete) opts.afterDelete();
  };
  const doRestore=()=>{
    const l=ls.get(listKey,[]);
    l.splice(Math.min(idx,l.length),0,item);
    ls.set(listKey,l);
    if(opts.rerender) opts.rerender();
    if(opts.afterRestore) opts.afterRestore();
  };
  uiConfirm('删除'+opts.label+'「'+name+'」？', ()=>{
    doRemove();
    toastUndo('已删除'+opts.label, doRestore);
  }, {title:'删除'+opts.label, okText:'删除'});
}
// 通用表单弹窗：统一「标题 + 字段 + 保存按钮 + 关闭」结构。
// fields: [{id,label,type:'input'|'date'|'select',value,placeholder,options:[{value,name}]}]
// onSave(values) 返回 false 时弹窗保持打开（校验失败），否则自动关闭。
function formModal(opts){
  const fields = opts.fields.map(f=>{
    const val = esc(f.value!=null?String(f.value):'');
    const ph = f.placeholder? ' placeholder="'+esc(f.placeholder)+'"' : '';
    if(f.type==='select') return '<div class="field"><label>'+esc(f.label)+'</label><select id="'+f.id+'">'
      + f.options.map(o=>'<option value="'+esc(o.value)+'"'+(String(o.value)===String(f.value)?' selected':'')+'>'+esc(o.name)+'</option>').join('') + '</select></div>';
    const type = f.type==='date'? ' type="date"' : f.type==='time'? ' type="time"' : '';
    return '<div class="field"><label>'+esc(f.label)+'</label><input id="'+f.id+'"'+type+' value="'+val+'"'+ph+'></div>';
  }).join('');
  openModal('<h3>'+esc(opts.title)+'<span class="x">×</span></h3>'+fields
    +'<button class="btn btn-primary" style="width:100%" data-save>'+esc(opts.saveText||'保存')+'</button>');
  $('#drawer [data-save]').onclick=()=>{
    const values = opts.fields.map(f=>$('#'+f.id).value);
    if(opts.onSave(values)!==false) closeModal();
  };
}
// 通用完成态切换：提醒 / 每日任务共用（列表项须含 done 字段与 id）
function toggleDone(listKey, id, rerender){
  const list=ls.get(listKey,[]);
  const it=list.find(x=>x.id===id);
  const wasDone = it? !!it.done : false;
  if(it){ it.done=!it.done; ls.set(listKey,list); }
  rerender();
  renderFocus();
  // 每日任务：完成时给一次可见的正反馈（第一次完成 → 连击天数；每 5 件 → 小鼓励）
  if(listKey==='daily_tasks' && it && it.done && !wasDone){
    const today=todayStr();
    const doneToday=ls.get('daily_tasks',[]).filter(x=>x.done && x.date===today).length;
    const st=weeklyStats();
    if(doneToday===1) setTimeout(()=>celebrate('🔥 连续 '+Math.max(1,st.streak)+' 天', '今天的第一件事，完成了'), 260);
    else if(doneToday>1 && doneToday%5===0) setTimeout(()=>celebrate('已完成 '+doneToday+' 件', '今天状态不错，继续保持'), 260);
  }
}
function copyText(t){ if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(t).then(()=>toast('已复制')).catch(()=>fallbackCopy(t)); } else fallbackCopy(t); }
function fallbackCopy(t){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('已复制'); }catch(e){ toast('复制失败'); } ta.remove(); }
function openLightbox(src){ $('#lbImg').src=src; $('#lightbox').classList.add('show'); }

$('#lightbox').addEventListener('click', e=>{ if(e.target===$('#lightbox')||e.target.classList.contains('lb-close')) closeLightbox(); });

function applyTheme(){
  const dark=ls.get('theme','light')==='dark';
  document.body.classList.toggle('dark', dark);
  // body 已就绪并切换主题类后，清除首帧防闪烁用的 html 内联底色
  document.documentElement.style.backgroundColor='';
}
function toggleTheme(){ ls.set('theme', ls.get('theme','light')==='dark'?'light':'dark'); applyTheme(); }
function fetchWithTimeout(url, opts={}, ms=15000){
  const ctrl = new AbortController(); const id = setTimeout(()=>ctrl.abort(), ms);
  return fetch(url, Object.assign({}, opts, {signal:ctrl.signal})).finally(()=>clearTimeout(id));
}
// 统一 API 请求封装：body 非 null 自动加 JSON 头并转 POST；有 key 自动加 Bearer 认证
function apiFetch(cfg, {method, body, timeout, headers:extraHeaders}={}){
  const headers=Object.assign({}, extraHeaders||{});
  if(body) headers['Content-Type']='application/json';
  if(cfg.key) headers['Authorization']='Bearer '+cfg.key;
  return fetchWithTimeout(cfg.url, {method:method||(body?'POST':'GET'), headers, body: body?JSON.stringify(body):undefined}, timeout||15000);
}
function apiErrMsg(e){ if(e && e.name==='AbortError') return '请求超时，请检查网络或接口地址'; return (e&&e.message)||'未知错误'; }

/* ---------- Adaptive scroll (屏幕尺寸 + 内容自适应) ---------- */
// 全端统一 page 模式：body 最小高度 100vh、随内容增长，整页滚动；顶栏 sticky 吸顶
// 保留函数与 resize 监听，负责清理历史版本可能残留的内联 overflow 限制
function adaptScroll(){
  document.body.dataset.scroll = 'page';
  document.querySelectorAll('.col-left,.col-center,.col-right,.card').forEach(el=>{ el.style.overflow=''; });
}
// resize 防抖：避免拖拽窗口/大屏缩放时高频全量查询造成卡顿

window.addEventListener('resize', ()=>{ clearTimeout(_rszT); _rszT=setTimeout(adaptScroll,150); });
