<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<!-- 页面自带深/浅色切换，声明仅浅色可禁用浏览器"强制暗色"，避免其反色破坏对比度 -->
<meta name="color-scheme" content="only light">
<meta name="description" content="布谷鸟 Cuckoo 工作台：提醒、每日任务、看板、日历、邮件与 AI 文本/图像生成集成于一体的个人效率工作台（数据仅存本机浏览器）。">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3370ff">
<script>
// PWA：仅在 https / localhost 环境注册 Service Worker（file:// 直开跳过，不影响本地使用）
if('serviceWorker' in navigator && (location.protocol==='https:' || ['localhost','127.0.0.1'].includes(location.hostname))){
  addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
// 主题防闪烁：深色用户在 body 渲染前先把 html 底色刷为深色，避免首帧白闪（applyTheme 中还原）
try{ if(localStorage.getItem('wb_cuckoo_theme')==='"dark"') document.documentElement.style.backgroundColor='#1c1f26'; }catch(e){}
</script>
<!-- 云服务 SDK（CDN IIFE）：登录 + 云备份；defer 非阻塞加载，初始化在 DOMContentLoaded 兜底执行（失败不影响其余功能） -->
<script defer src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<title>Cuckoo 工作台</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNyIgZmlsbD0iIzMzNzBmZiIvPjxjaXJjbGUgY3g9IjE2IiBjeT0iMTYiIHI9IjkiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIyIi8+PHBhdGggZD0iTTE2IDExdjVsMy41IDIiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48L3N2Zz4=">
<style>
  :root{
    /* 飞书风配色：主蓝 #3370ff + 冷调蓝灰中性色；阴影克制、以描边分层 */
    --bg:#f2f3f5; --card:#ffffff; --primary:#3370ff; --primary-d:#245bdb;
    --primary-soft:rgba(51,112,255,.10);
    --text:#1f2329; --muted:#646a73; --border:#dee0e3; --border-strong:#bbbfc4; --danger:#f54a45;
    --warn:#f59e0b; --ok:#16a34a; --soft:#f0f4ff; --radius:12px;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
    --shadow-lift:0 4px 10px rgba(16,24,40,.08),0 14px 32px rgba(16,24,40,.12);
    --shadow-pop:0 8px 24px rgba(16,24,40,.12);
    --topbar-h:60px;
    /* 流式间距：随视口宽度在 12–20px 间缩放，卡片间距与内边距自适应各尺寸屏幕 */
    --gap:clamp(12px, 1vw, 20px);
    --card-pad:clamp(14px, 1.1vw, 22px);
    /* 品牌渐变：飞书蓝三阶，用于主按钮/徽章/今日高亮等焦点元素 */
    --grad:linear-gradient(135deg,#4e83fd,#3370ff 55%,#245bdb);
    /* 统一运动语言：ease 主曲线（自然减速）/ spring 回弹曲线 */
    --ease:cubic-bezier(.22,1,.36,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    /* 环境光：蓝紫两组低饱和光斑（纯 CSS，无图片资源），比 teal 版更克制 */
    background:radial-gradient(1100px 520px at 12% -8%,rgba(51,112,255,.07),transparent 60%),radial-gradient(900px 480px at 105% -5%,rgba(0,145,255,.05),transparent 55%),linear-gradient(180deg,#f5f6f8 0%,var(--bg) 320px); color:var(--text); font-size:14px; line-height:1.5;
    min-height:100vh;
    display:flex; flex-direction:column;
  }
  button{font-family:inherit;cursor:pointer}
  /* 统一交互反馈：所有可点元素有过渡，键盘聚焦有可见焦点环 */
  button,input,textarea,select{transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,transform .15s}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .search-box input:focus{box-shadow:none}
  .search-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  /* 全局细滚动条 */
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:#b6c0cb}
  ::-webkit-scrollbar-track{background:transparent}
  input,textarea,select{font-family:inherit;font-size:16px;color:var(--text);min-width:0}

  /* ---------- Top bar ---------- */
  .topbar{height:var(--topbar-h); display:flex; align-items:center; gap:12px; padding:0 16px; background:rgba(255,255,255,.82); backdrop-filter:blur(14px) saturate(1.5); -webkit-backdrop-filter:blur(14px) saturate(1.5); border-bottom:1px solid var(--border); flex-shrink:0; position:sticky; top:0; z-index:30;}
  .brand{font-weight:700; font-size:18px; color:var(--primary); white-space:nowrap; display:flex; align-items:center; gap:6px}
  .brand svg{width:22px;height:22px}
  .reminders{display:flex; gap:8px; flex:1; overflow-x:auto; padding:6px 2px; scrollbar-width:thin}
  .reminders::-webkit-scrollbar{height:4px}
  .reminders::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  .rem-chip{display:flex; align-items:center; gap:6px; background:var(--soft); border:1px solid #c9d9ff; border-radius:999px; padding:5px 10px; white-space:nowrap; flex-shrink:0; max-width:260px;}
  .rem-chip.overdue{background:#fef2f2;border-color:#fecaca;color:var(--danger)}
  .rem-chip .rem-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
  .rem-chip .rem-date{font-size:11px;color:var(--muted)}
  .rem-chip.overdue .rem-date{color:var(--danger)}
  .rem-done{border:none;background:var(--grad);color:#fff;border-radius:999px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 1px 5px rgba(51,112,255,.35);transition:transform .18s var(--ease-spring)}
  .rem-done:active{transform:scale(.85)}
  .rem-done svg{width:13px;height:13px}
  .rem-empty{color:var(--muted);font-size:13px;padding:6px 4px}
  .top-actions{display:flex;gap:8px;flex-shrink:0}
  .btn{border:1px solid var(--border); background:#fff; color:var(--text); border-radius:8px; padding:8px 12px; min-height:40px; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-size:13px; white-space:nowrap; flex-shrink:0;}
  .btn svg{width:16px;height:16px}
  .btn:hover{border-color:var(--border-strong);background:#f8fafc}
  .btn-primary{background:var(--grad);border-color:var(--primary-d);color:#fff;box-shadow:0 2px 10px rgba(51,112,255,.30),inset 0 1px 0 rgba(255,255,255,.28)}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(51,112,255,.38),inset 0 1px 0 rgba(255,255,255,.28)}
  .btn-primary:active{transform:translateY(0) scale(.98);box-shadow:0 1px 5px rgba(51,112,255,.3),inset 0 1px 0 rgba(255,255,255,.2)}
  /* 通用按压反馈：所有按钮按下轻微收缩，松手回弹（配合全局 transition） */
  .btn:active{transform:scale(.97)}
  .btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn-danger:hover{background:#b91c1c;border-color:#b91c1c}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn-ghost:hover{background:transparent;border-color:transparent;color:var(--text)}
  .btn-sm{padding:6px 10px;min-height:34px;font-size:12px}

  /* ---------- Backup hint ---------- */
  .backup-hint{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:8px 16px;font-size:13px;display:flex;align-items:center;gap:8px;flex-shrink:0;position:relative;z-index:20;}
  .backup-hint[hidden]{display:none}
  .backup-hint button{margin-left:auto}

  /* ---------- Layout (左-中-右) ---------- */
  /* 页面级滚动：主区自然高度，内容随页面下滚；顶栏 sticky 吸顶 */
  .main{flex:1; display:flex; gap:var(--gap); padding:var(--gap)}
  /* AI 列居左：视觉顺序 = AI(左) → 今日清单/项目进度(中) → 日程/收件箱(右) */
  .col-left{flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--gap); order:1}
  .col-center{flex:2.2; min-width:0; display:flex; flex-direction:column; gap:var(--gap); order:2}
  .col-right{flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--gap); order:3}
  /* 卡片材质：顶部内侧高光模拟受光面；hover 阴影加深（不位移，避免大面积抖动） */
  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.75); padding:var(--card-pad); display:flex; flex-direction:column; min-height:0; transition:box-shadow .25s var(--ease),border-color .25s var(--ease);}
  .card:hover{box-shadow:var(--shadow-lift),inset 0 1px 0 rgba(255,255,255,.75); border-color:var(--border-strong)}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .card-head .ttl{font-weight:600;font-size:15px;display:flex;align-items:center;gap:9px;white-space:nowrap;flex-shrink:0}
  /* 卡片标题图标改为「色块徽章」：柔和底色 + 圆角，建立模块识别度 */
  /* 卡片标题徽章：品牌渐变底 + 内高光，建立模块识别度 */
  .card-head .ttl svg{width:32px;height:32px;padding:7px;border-radius:9px;background:linear-gradient(135deg,var(--primary-soft),rgba(14,165,233,.12));color:var(--primary);flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
  .card-head .act{margin-left:auto;display:flex;gap:6px;flex-shrink:0}

  /* ---------- Text writer ---------- */
  /* 左栏合并卡片组：文本编写 + 图片设计 同处一张卡片，虚线分隔保持层次 */
  #genCard{gap:0}
  .gen-group{display:flex;flex-direction:column;min-height:0}
  .gen-divider{border:none;border-top:1px dashed var(--border);margin:14px 0;flex-shrink:0}
  .writer-box{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
  .writer-box textarea{flex:1;min-height:80px;resize:none;border:1px solid var(--border);border-radius:10px;padding:10px;line-height:1.5;}
  .writer-row{display:flex;gap:8px;align-items:center}
  .writer-result{border:1px solid var(--border);border-radius:10px;padding:10px;background:#fafafa;font-size:13px;white-space:pre-wrap;overflow:auto;max-height:150px;min-height:40px;color:#374151;}
  .hist{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px;overflow:auto;max-height:110px}
  .hist-item{border:1px solid var(--border);border-radius:8px;padding:7px 9px;margin-bottom:6px;font-size:12px}
  .hist-item .h-q{color:var(--primary);font-weight:600;margin-bottom:2px}
  .hist-item .h-a{color:#374151;white-space:pre-wrap}
  .muted-tip{font-size:12px;color:var(--muted);background:#f8fafc;border:1px dashed var(--border);border-radius:8px;padding:8px;margin-top:8px}
  /* ---------- AI 一键动作 chips ---------- */
  .ai-chips{display:flex;gap:6px;flex-wrap:wrap}
  .ai-chip{border:1px solid #c9d9ff;background:var(--soft);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--primary);white-space:nowrap;min-height:30px;transition:border-color .15s,background-color .15s,transform .15s}
  .ai-chip:hover{border-color:var(--primary);transform:translateY(-1px)}
  .ai-chip:active{transform:translateY(0)}
  body.dark .ai-chip{border-color:var(--border)}
  body.dark .ai-chip:hover{border-color:var(--primary)}

  /* ---------- Image designer ---------- */
  .img-prompt{display:flex;gap:8px}
  .img-prompt input{flex:1;border:1px solid var(--border);border-radius:10px;padding:9px 10px;min-height:42px}
  .img-stage{margin-top:10px;border:2px dashed var(--border);border-radius:10px;min-height:130px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;overflow:hidden;background:#fafafa;}
  .img-stage img{max-width:100%;max-height:220px;border-radius:8px;display:block}
  .img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:10px}
  .img-grid img{width:100%;aspect-ratio:1;border-radius:8px;border:1px solid var(--border);object-fit:cover;cursor:pointer;transition:transform .18s,box-shadow .18s}
  .img-grid img:hover{transform:scale(1.04);box-shadow:var(--shadow);position:relative;z-index:1}
  .spin{width:18px;height:18px;border:2px solid #cbd5e1;border-top-color:var(--primary);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- Daily task list (横滑) ---------- */
  #dailyCard{flex-shrink:0}
  .daily-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
  .daily-tabs::-webkit-scrollbar{height:4px}
  .daily-tabs::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  .daily-tab{border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;white-space:nowrap;flex-shrink:0;color:var(--muted)}
  .daily-tab.active{background:var(--grad);border-color:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(51,112,255,.28)}
  /* ---------- 每日任务：连击打卡 + 本周统计条 ---------- */
  .daily-stats{display:flex;align-items:flex-end;gap:10px;margin-bottom:8px;padding:8px 12px;background:var(--soft);border-radius:10px}
  .ds-streak{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;align-self:center}
  .ds-bars{display:flex;gap:5px;align-items:flex-end;margin-left:auto}
  .ds-col{display:flex;flex-direction:column;align-items:center;gap:2px}
  .ds-col i{width:8px;border-radius:3px;background:var(--border);display:block;transition:height .35s var(--ease);transform-origin:bottom;animation:barGrow .5s var(--ease) .2s backwards}
  .ds-col i.on{background:linear-gradient(180deg,var(--primary),#6c9bff)}
  .ds-col:nth-child(2) i{animation-delay:.25s}.ds-col:nth-child(3) i{animation-delay:.3s}
  .ds-col:nth-child(4) i{animation-delay:.35s}.ds-col:nth-child(5) i{animation-delay:.4s}
  .ds-col:nth-child(6) i{animation-delay:.45s}.ds-col:nth-child(7) i{animation-delay:.5s}
  .ds-col em{font-style:normal;font-size:9px;color:var(--muted);line-height:1}
  .ds-total{font-size:11px;color:var(--muted);white-space:nowrap;align-self:center;margin-left:4px}
  .ds-share{margin-left:6px;align-self:center}
  body.dark .ds-streak{color:var(--text)}
  /* ---------- 分享卡片 / 邀请 ---------- */
  .share-preview{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#f8fafc;text-align:center}
  .share-preview img{max-width:100%;max-height:52vh;display:block;margin:0 auto}
  .share-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .share-btns .btn{flex:1;min-width:100px}
  /* ---------- 场景模板卡片 ---------- */
  .tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
  .tpl-card{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--soft);display:flex;flex-direction:column;gap:4px;transition:border-color .2s var(--ease),box-shadow .22s var(--ease),transform .22s var(--ease)}
  .tpl-card:hover{border-color:var(--primary);box-shadow:var(--shadow);transform:translateY(-2px)}
  .tpl-card .tp-name{font-weight:600;font-size:14px}
  .tpl-card .tp-desc{font-size:12px;color:var(--muted);line-height:1.4}
  .tpl-card .tp-meta{font-size:11px;color:var(--muted)}
  .tpl-card .btn{margin-top:6px;align-self:flex-start}
  body.dark .tpl-card{background:var(--bg)}
  .daily-wrap{display:flex;align-items:center;gap:6px}
  .daily-arrow{width:30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .daily-scroll{flex:1;display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-behavior:smooth}
  .daily-scroll::-webkit-scrollbar{height:6px}
  .daily-scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px}
  .daily-card{min-width:190px;max-width:clamp(240px, 15vw, 300px);background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:10px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;transition:border-color .2s var(--ease),box-shadow .25s var(--ease),transform .25s var(--ease)}
  .daily-card:not(.done):hover{border-color:var(--border-strong);box-shadow:var(--shadow);transform:translateY(-1px)}
  .daily-card.done{opacity:.55}
  .daily-card .dc-top{display:flex;align-items:center;gap:8px}
  .daily-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--primary);background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .daily-check.on{background:var(--primary)}
  .daily-check svg{width:13px;height:13px;color:#fff;display:none}
  .daily-check.on svg{display:block}
  .daily-card .dc-title{font-size:13px;flex:1;line-height:1.4}
  .daily-card.done .dc-title{text-decoration:line-through;color:var(--muted)}
  .daily-card .dc-bot{display:flex;align-items:center;gap:6px}
  .daily-card .dc-date{font-size:11px;color:var(--muted)}
  .daily-card .dc-del{margin-left:auto;border:none;background:transparent;color:var(--muted);font-size:15px;line-height:1}
  .dc-bot .ic-btn{width:24px;height:24px;margin-left:6px}
  .daily-empty{color:var(--muted);font-size:13px;padding:16px;text-align:center;width:100%}

  /* ---------- Vertical Kanban ---------- */
  #kanbanCard{flex:1}
  .kpi{display:flex;align-items:center;gap:14px;margin-bottom:10px}
  .kpi .ring{flex-shrink:0}
  .kpi .bars{flex:1;display:flex;flex-direction:column;gap:6px}
  .bar-row{display:flex;align-items:center;gap:8px;font-size:12px}
  .bar-row .bl{width:54px;color:var(--muted);flex-shrink:0}
  .bar-track{flex:1;height:8px;background:#f1f5f9;border-radius:6px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary),var(--primary-d));transition:width .3s ease}
  .bar-row .bn{width:30px;text-align:right;color:var(--muted)}
  .ksec{border:1px solid var(--border);border-radius:10px;padding:9px;margin-bottom:8px;background:#fff}
  .ksec .ksh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:6px;white-space:nowrap}
  .ksec .ksh .dot{width:9px;height:9px;border-radius:50%}
  .ksec .ksh .kc{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px}
  .ksec .ksh .kadd2{border:1px dashed var(--border);background:#fff;border-radius:6px;padding:2px 9px;font-size:12px;color:var(--muted)}
  .ks-cards{display:flex;flex-direction:column;gap:6px}
  .kcard{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:13px;display:flex;align-items:center;gap:8px;transition:border-color .2s var(--ease),background-color .2s var(--ease),transform .22s var(--ease),box-shadow .22s var(--ease)}
  .kcard:hover{border-color:var(--border-strong);background:#fff;transform:translateY(-2px);box-shadow:var(--shadow)}
  .kcard[draggable="true"]{cursor:grab}
  .kcard.dragging{opacity:.45}
  .ksec.drag-over{border-color:var(--primary);background:var(--soft)}
  .kcard .kt{flex:1;min-width:0}
  .kcard .kact{display:flex;gap:4px;flex-shrink:0}
  .kcard .kact button{width:26px;height:26px;border:1px solid var(--border);background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .kcard .kact button:disabled{opacity:.3}
  .kempty{color:#cbd5e1;font-size:12px;text-align:center;padding:8px 0}

  /* ---------- Calendar ---------- */
  #calCard{flex-shrink:0}
  .cal-nav{display:flex;align-items:center;gap:6px}
  .cal-nav .m{font-weight:600;min-width:96px;text-align:center}
  .cal-nav button{width:32px;height:32px;border:1px solid var(--border);background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
  .cal-grid .wd{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
  .cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;cursor:pointer;border:1px solid transparent;position:relative;transition:background-color .15s}
  .cal-day:hover{background:#f1f5f9}
  .cal-day.other{color:#cbd5e1}
  .cal-day.today{background:var(--grad);color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(51,112,255,.38),inset 0 1px 0 rgba(255,255,255,.3)}
  .cal-day .dots{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:2px}
  .cal-day .dot{width:5px;height:5px;border-radius:50%;background:var(--primary)}
  .cal-day .dot.d-daily{background:var(--warn)}
  .cal-day .dot.d-rem{background:var(--danger)}
  .cal-day.today .dot{background:#fff}

  /* ---------- Email ---------- */
  #emailCard{flex:1}
  .mail-list{display:flex;flex-direction:column;gap:8px;overflow:auto;flex:1;min-height:0}
  .mail-item{border:1px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;background:#fff;transition:border-color .2s var(--ease),box-shadow .22s var(--ease),transform .22s var(--ease)}
  .mail-item:hover{border-color:var(--border-strong);box-shadow:var(--shadow);transform:translateY(-2px)}
  .mail-item .m-top{display:flex;align-items:baseline;gap:8px}
  .mail-item .m-from{font-weight:600;font-size:13px}
  .mail-item .m-date{font-size:11px;color:var(--muted);margin-left:auto;flex-shrink:0}
  .mail-item .m-sub{font-size:13px;margin-top:2px}
  .mail-item .m-snip{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* ---------- Mail toolbar (P2-2 搜索 + 未读筛选) ---------- */
  .mail-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .search-box{flex:1;display:flex;align-items:center;gap:6px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:0 10px;min-height:38px}
  .search-box svg{width:15px;height:15px;color:var(--muted);flex-shrink:0}
  .search-box input{flex:1;border:none;background:transparent;outline:none;padding:8px 0;font-size:14px;color:var(--text)}
  .search-box input::-webkit-search-cancel-button{cursor:pointer}
  .btn.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .mail-empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 8px}
  /* ---------- 邮箱采集 ---------- */
  .ac-row{display:flex;align-items:center;gap:8px}
  .ac-badge{font-size:11px;font-weight:600;color:var(--primary);background:var(--primary-soft);border-radius:5px;padding:2px 8px;flex-shrink:0;white-space:nowrap}
  .prio-dot{width:8px;height:8px;border-radius:999px;flex-shrink:0}
  .kdue{font-size:11px;color:var(--muted);background:var(--soft);border-radius:5px;padding:1px 6px;flex-shrink:0;white-space:nowrap}
  .kdue.overdue{color:var(--danger);border:1px solid var(--danger);background:transparent}
  .ac-mail{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
  .ac-count{color:var(--muted);font-weight:400;margin-left:4px}
  .m-via{font-size:10px;color:var(--primary);background:var(--primary-soft);border-radius:4px;padding:1px 6px;margin-left:6px;flex-shrink:0;align-self:center}
  body.dark .search-box{background:var(--bg);border-color:var(--border)}
  /* ---------- Kanban toolbar (P2-3 搜索 + 列筛选) ---------- */
  .kanban-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .kb-filters{display:flex;gap:4px;flex-shrink:0}
  .kb-filter{padding:5px 10px;border:1px solid var(--border);background:#fff;border-radius:8px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s}
  .kb-filter.on{color:#fff;border-color:transparent}
  .kb-filter[data-col="todo"].on{background:#94a3b8}
  .kb-filter[data-col="doing"].on{background:#0ea5e9}
  .kb-filter[data-col="done"].on{background:#16a34a}
  body.dark .kb-filter{background:var(--soft);border-color:var(--border)}

  /* ---------- Drawer / Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50;display:none;align-items:center;justify-content:center}
  .overlay.show{display:flex;animation:ovIn .22s ease both}
  @keyframes ovIn{from{opacity:0}}
  .drawer{background:#fff;width:100%;max-width:460px;border-radius:16px;max-height:88vh;overflow:auto;padding:18px;margin:auto;box-shadow:var(--shadow-pop)}
  .drawer h3{margin:0 0 14px;font-size:17px;display:flex;align-items:center;gap:8px}
  .drawer h3 .x{margin-left:auto;width:32px;height:32px;border:none;background:#f1f5f9;border-radius:8px;font-size:18px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;line-height:1;flex-shrink:0}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 10px;}
  .field input,.field select{min-height:40px}
  .sec{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px}
  .sec .sec-t{font-weight:600;font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .sec .sec-t svg{width:26px;height:26px;padding:5px;border-radius:7px;background:var(--primary-soft);color:var(--primary)}
  .data-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .hint{font-size:12px;color:var(--muted);background:#f8fafc;border:1px dashed var(--border);border-radius:8px;padding:8px;margin-top:6px}
  .modal-center .drawer{border-radius:18px;margin:auto}
  .overlay.modal-center{align-items:center;padding:16px}
  /* 弹层入场动画：淡入 + 轻微上浮缩放（transform/opacity，GPU 合成，不触发布局） */
  .overlay.show .drawer{animation:drawerIn .32s var(--ease)}
  @keyframes drawerIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
  .lightbox.show img{animation:drawerIn .2s ease}

  /* ---------- Toast（含撤销按钮） ---------- */
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:9px 14px 9px 18px;border-radius:999px;z-index:90;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.32);display:flex;align-items:center;gap:10px;animation:toastIn .32s var(--ease-spring);max-width:88vw}
  .toast .t-msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toast button{border:none;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:3px 12px;font-size:12px;min-height:26px;flex-shrink:0}
  .toast button:hover{background:rgba(255,255,255,.3)}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

  /* ---------- 窄窗口 (≤1200)：三栏过挤，改为换行堆叠，卡片占满栏宽自适应 ----------
     注意：手机端 viewport 固定 1280，永远不命中此断点；此规则只服务于可调窄的桌面窗口 */
  @media (max-width:1200px){
    .main{flex-wrap:wrap}
    .col-left{flex:1 1 300px}
    .col-center{flex:1.4 1 420px}
    .col-right{flex:1 1 100%; flex-direction:row; flex-wrap:wrap; align-items:flex-start}
    #calCard{flex:1 1 340px}
    #emailCard{flex:1 1 280px}
  }

  /* ---------- 大屏 (>1600)：内容限宽居中，卡片与间距随 --gap/--card-pad 放大，充分利用空间 ---------- */
  @media (min-width:1600px){
    .main{max-width:1840px; margin:0 auto}
    .backup-hint{max-width:1840px; margin:0 auto; width:calc(100% - var(--gap)*2)}
  }

  /* ---------- 进场动画：三栏卡片依次上浮淡入（stagger），顶栏/背景即时呈现 ---------- */
  @keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
  .col-left>*,.col-center>*,.col-right>*{animation:cardIn .55s var(--ease) backwards}
  .col-left>:nth-child(1){animation-delay:.05s}.col-left>:nth-child(2){animation-delay:.12s}.col-left>:nth-child(3){animation-delay:.19s}
  .col-center>:nth-child(1){animation-delay:.02s}.col-center>:nth-child(2){animation-delay:.09s}.col-center>:nth-child(3){animation-delay:.16s}
  .col-right>:nth-child(1){animation-delay:.1s}.col-right>:nth-child(2){animation-delay:.17s}.col-right>:nth-child(3){animation-delay:.24s}
  @keyframes barGrow{from{transform:scaleY(0)}}
  /* 勾选完成回弹：类切换时触发一次 pop */
  @keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
  .daily-card.done .daily-check,.rem-chip .rem-done{animation:pop .35s var(--ease-spring)}

  /* ---------- Theme toggle ---------- */
  .theme-toggle{width:38px;height:38px;border:1px solid var(--border);background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
  .theme-toggle svg{width:18px;height:18px}
  /* 亮色显示太阳、暗色显示月亮 */
  .theme-toggle .icon-moon{display:none}
  body.dark .theme-toggle .icon-sun{display:none}
  body.dark .theme-toggle .icon-moon{display:block}

  /* ---------- Lightbox ---------- */
  .lightbox{position:fixed;inset:0;background:rgba(15,23,42,.88);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
  .lightbox.show{display:flex}
  .lightbox img{max-width:92vw;max-height:86vh;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.5);cursor:default}
  .lb-close{position:absolute;top:18px;right:18px;width:42px;height:42px;border:none;background:rgba(255,255,255,.15);color:#fff;border-radius:50%;font-size:22px;display:flex;align-items:center;justify-content:center}
  .lb-dl{position:absolute;bottom:20px;left:50%;transform:translateX(-50%)}

  /* ---------- generic icon button ---------- */
  .ic-btn{width:26px;height:26px;border:1px solid var(--border);background:#fff;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;padding:0}
  .ic-btn svg{width:14px;height:14px;display:block}
  .ic-btn.danger{color:var(--danger);border-color:#fecaca}

  /* ---------- email read state ---------- */
  .mail-item{position:relative}
  .mail-item.unread{border-left:3px solid var(--primary);background:var(--soft)}
  .mail-item .m-unread{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--primary);margin-right:6px;vertical-align:middle}
  .mail-item.read .m-unread{display:none}
  .mail-actions{display:flex;justify-content:flex-end;margin-top:8px}
  .mail-del{position:absolute;top:8px;right:8px}

  /* ---------- Dark theme ---------- */
  /* 冷调蓝灰层次（飞书暗色风）：页=--bg / 卡=--card / 内衬=--soft / 线=--border；主蓝提亮保证对比度 */
  body.dark{ color-scheme:dark; --bg:#1c1f26; --card:#252a33; --primary:#6294fe; --primary-d:#4e83fd; --primary-soft:rgba(98,148,254,.16);
    --text:#f0f3f8; --muted:#98a2b3; --border:#3a4150; --border-strong:#4a5364; --soft:#2d3440;
    --grad:linear-gradient(135deg,#6294fe,#3370ff 55%,#245bdb);
    --shadow:0 2px 8px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
    --shadow-lift:0 6px 14px rgba(0,0,0,.45),0 16px 36px rgba(0,0,0,.4);
    --shadow-pop:0 16px 48px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04),inset 0 1px 0 rgba(255,255,255,.05); }
  /* 环境光：页面顶部两组低饱和光斑（纯 CSS 渐变，无图片资源） */
  body.dark{background:radial-gradient(1100px 520px at 15% -10%,rgba(98,148,254,.09),transparent 60%),radial-gradient(900px 460px at 108% -6%,rgba(0,145,255,.05),transparent 55%),var(--bg)}
  /* 卡片顶部内侧高光：模拟顶部受光面，增强层次 */
  body.dark .topbar{background:rgba(24,27,30,.78);border-bottom-color:var(--border)}
  body.dark .card{box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05)}
  body.dark .card:hover{box-shadow:var(--shadow-lift),inset 0 1px 0 rgba(255,255,255,.05)}
  body.dark .topbar,body.dark .theme-toggle,body.dark .btn,body.dark .daily-arrow,body.dark .cal-nav button,
  body.dark .kcard .kact button,body.dark .kadd2,body.dark .ic-btn{background:var(--card);color:var(--muted)}
  body.dark .daily-check{background:var(--soft)}
  body.dark .daily-check.on{background:var(--primary)}
  body.dark .daily-check.on svg{color:#fff}
  body.dark .btn.on{background:var(--primary);border-color:var(--primary);color:#fff}
  body.dark .daily-tab{background:var(--soft);border-color:var(--border);color:var(--muted)}
  body.dark .daily-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
  body.dark .btn-primary{background:var(--grad);border-color:#4e83fd;color:#fff;box-shadow:0 2px 10px rgba(51,112,255,.30),inset 0 1px 0 rgba(255,255,255,.28)}
  body.dark .ksec .ksh .kadd2{background:var(--card);color:var(--muted)}
  body.dark .sec,body.dark .writer-result,body.dark .img-stage,body.dark .daily-card,
  body.dark .kcard,body.dark .mail-item,body.dark .muted-tip,body.dark .hint,body.dark .hist-item,
  body.dark input,body.dark textarea,body.dark select{background:var(--bg)}
  body.dark .drawer{background:var(--card)}
  body.dark .ksec{background:var(--card)}
  body.dark .mail-item.unread{background:var(--soft)}
  body.dark .kcard:hover{background:var(--soft)}
  body.dark .daily-card:not(.done):hover{background:var(--soft)}
  body.dark .btn:hover{background:var(--soft);border-color:var(--border-strong)}
  body.dark .writer-result,body.dark .hist-item .h-a,body.dark .m-sub{color:var(--text)}
  body.dark .backup-hint{background:#422006;border-color:#854d0e;color:#fcd34d}
  body.dark .bar-track{background:var(--border)}
  body.dark .cal-day:hover{background:var(--border)}
  body.dark .cal-day.other{color:#6b6b6b}
  body.dark .cal-day.today{color:#fff}
  body.dark .rem-done{color:#fff;box-shadow:0 1px 5px rgba(98,148,254,.32)}
  body.dark .cal-day.today{box-shadow:0 2px 8px rgba(51,112,255,.30)}
  body.dark .rem-chip{background:var(--soft);border-color:#474747}
  body.dark .rem-chip.overdue{background:#450a0a;border-color:#7f1d1d;color:#fca5a5}
  body.dark .drawer .x{background:var(--border);color:var(--muted)}
  body.dark ::-webkit-scrollbar-thumb{background:var(--border)}
  body.dark ::-webkit-scrollbar-thumb:hover{background:var(--border-strong)}
  /* ---------- Today panel 已移除：与顶栏提醒条/每日任务/日历功能重复（2026-11-09） ---------- */

  /* ---------- 今日焦点条 + 记一笔（打开就能用：一眼看到今天，一句话记下事情） ---------- */
  .focusbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px var(--card-pad);border-bottom:1px solid var(--border);
    background:linear-gradient(90deg,var(--primary-soft),rgba(51,112,255,.02) 55%,transparent)}
  .fb-main{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 300px;flex-wrap:wrap}
  .fb-title{font-weight:650;font-size:13.5px;color:var(--text);white-space:nowrap}
  .fb-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
  .fb-chip{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap;cursor:pointer;transition:border-color .16s var(--ease),color .16s var(--ease)}
  .fb-chip:hover{border-color:var(--primary);color:var(--primary)}
  .fb-chip.plain{cursor:default}
  .fb-chip.plain:hover{border-color:var(--border);color:var(--muted)}
  .fb-chip.hot{background:#fff7ed;border-color:#fed7aa;color:#c2410c}
  .fb-chip.fire{background:#fff7ed;border-color:#fed7aa;color:#c2410c;font-weight:600}
  .fb-add{display:flex;align-items:center;gap:8px;flex:0 1 400px;min-width:240px}
  .fb-add input{flex:1;min-width:0;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13.5px;color:var(--text);transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
  .fb-add input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .fb-add input::placeholder{color:var(--muted)}

  /* ---------- 到点提醒浮层（页面内强提示，不依赖系统通知权限） ---------- */
  .due-pop{position:fixed;right:18px;bottom:18px;z-index:95;width:330px;max-width:calc(100vw - 36px);background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-pop);padding:13px;animation:dueIn .28s var(--ease-spring)}
  .dp-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:10px}
  .dp-bell{width:26px;height:26px;border-radius:8px;background:#fef3c7;color:#b45309;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .dp-item{border:1px solid var(--border);border-radius:10px;padding:9px 10px;margin-bottom:8px;background:var(--soft)}
  .dp-item:last-of-type{margin-bottom:0}
  .dpi-t{font-size:13.5px;font-weight:600;margin-bottom:2px;word-break:break-word}
  .dpi-m{font-size:11.5px;color:var(--muted);margin-bottom:7px}
  .dp-act{display:flex;gap:6px}
  .dp-foot{display:flex;gap:6px;margin-top:9px}
  @keyframes dueIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}

  /* ---------- 完成庆祝（连击外显） ---------- */
  .celebrate{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:96;background:var(--grad);color:#fff;border-radius:16px;padding:13px 24px;text-align:center;
    box-shadow:0 14px 40px rgba(51,112,255,.38);animation:celIn .42s var(--ease-spring)}
  .cel-big{font-size:21px;font-weight:800;letter-spacing:.4px}
  .cel-sub{font-size:12px;opacity:.9;margin-top:2px}
  @keyframes celIn{0%{opacity:0;transform:translate(-50%,-14px) scale(.9)}60%{opacity:1;transform:translate(-50%,2px) scale(1.02)}100%{transform:translate(-50%,0) scale(1)}}

  /* ---------- 会员与额度 ---------- */
  .plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0}
  .plan-card{border:1px solid var(--border);border-radius:12px;padding:11px;background:var(--card);display:flex;flex-direction:column;gap:3px}
  .plan-card.rec{border-color:var(--primary);background:var(--primary-soft)}
  .plan-name{font-weight:700;font-size:12.5px}
  .plan-price{font-size:19px;font-weight:800;color:var(--primary);letter-spacing:-.5px;line-height:1.2}
  .plan-price small{font-size:10.5px;font-weight:500;color:var(--muted)}
  .plan-li{font-size:11px;color:var(--muted);line-height:1.65}
  .usage-bar{height:6px;border-radius:999px;background:var(--border);overflow:hidden;margin:7px 0 5px}
  .usage-bar i{display:block;height:100%;background:var(--grad);border-radius:999px;transition:width .3s var(--ease)}

  /* ---------- 首启身份选择 ---------- */
  .persona-grid{display:flex;flex-direction:column;gap:8px;margin:12px 0}
  .persona{display:flex;align-items:center;gap:11px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--card);cursor:pointer;text-align:left;
    transition:border-color .16s var(--ease),box-shadow .2s var(--ease),transform .2s var(--ease)}
  .persona:hover{border-color:var(--primary);box-shadow:var(--shadow);transform:translateY(-1px)}
  .p-emoji{font-size:19px;line-height:1}
  .p-name{font-weight:650;font-size:13.5px}
  .p-desc{font-size:11.5px;color:var(--muted);margin-top:1px}

<script>
"use strict";
const $ = s => document.querySelector(s);
const PREFIX = 'wb_cuckoo_';
// 通用日期格式化：Date -> 'YYYY-MM-DD'（todayStr/shiftDay/seed/日历共用）
const fmtDate = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr = () => fmtDate(new Date());
const shiftDay = (n) => { const d=new Date(); d.setDate(d.getDate()+n); return fmtDate(d); };
const fmtMD = s => { const p=s.split('-'); return (p[1]?p[1]:'')+'/'+((p[2]||'').replace(/^0/,'')||''); };
const remHHMM = () => { const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const relDay = s => { if(!s) return ''; if(s===todayStr()) return '今天'; if(s===shiftDay(1)) return '明天'; if(s===shiftDay(2)) return '后天'; if(s===shiftDay(-1)) return '昨天'; return fmtMD(s); };
const rid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2,10);
const LIMITS = { topReminders:3, imgMax:9, textMax:50, backupHint:30, importMaxBytes:10*1024*1024 };
const CHK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
const ICON_GEN = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>';
const ICON_IMG = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';
const ICON_EDIT = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>';
const ICON_CHEV_L = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>';
const ICON_CHEV_R = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>';
const ICON_SEARCH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
const ICON_SHARE = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/></svg>';
/* ---------- 邮箱采集：服务商预置（IMAP 服务器/端口供代理参考；浏览器无法直连 IMAP） ---------- */
const MAIL_PROVIDERS = {
  qq:      {name:'QQ 邮箱',     host:'imap.qq.com',           port:993, hint:'QQ 邮箱网页版 → 设置 → 账户 → 开启 IMAP/SMTP 服务并生成授权码'},
  '163':   {name:'163 邮箱',    host:'imap.163.com',          port:993, hint:'163 网页版 → 设置 → POP3/SMTP/IMAP → 开启服务并获取授权码'},
  outlook: {name:'Outlook',     host:'outlook.office365.com', port:993, hint:'Microsoft 账户开启两步验证后生成应用密码，或注册 Azure 应用走 OAuth2'},
  gmail:   {name:'Gmail',       host:'imap.gmail.com',        port:993, hint:'Google 账户开启两步验证后生成应用专用密码，或注册 Google Cloud OAuth2'},
  icloud:  {name:'iCloud 邮箱', host:'imap.mail.me.com',      port:993, hint:'Apple ID → 登录与安全 → App 专用密码'}
};

const ls = {
  get(k, def){ try{ const v=localStorage.getItem(PREFIX+k); return v==null?def:JSON.parse(v); }catch(e){ return def; } },
  // 写库后自动执行备份检查，调用方无需再手工调用 checkBackup()
  set(k, v){ try{ localStorage.setItem(PREFIX+k, JSON.stringify(v)); checkBackup(); return true; }catch(e){ console.warn('[cuckoo] 存储写入失败:', k, e); toast('本地存储空间已满，请导出备份并清理历史记录'); return false; } },
  del(k){ localStorage.removeItem(PREFIX+k); }
};

/* ---------- 数据模型（localStorage schema） ----------
   所有键以 PREFIX('wb_cuckoo_') 前缀存储，值为 JSON：
   - reminders:      [{id, text, date:'YYYY-MM-DD', done}]
   - text_history:   [{id, q, a, t}]
   - image_history:  [{id, prompt, url(base64/dataURI), t}]
   - calendar_events:[{date:'YYYY-MM-DD', title}]
   - daily_tasks:    [{id, title, date:'YYYY-MM-DD', done}]
   - kanban:         [{id, title, col:'todo'|'doing'|'done'}]
   - email_cache:    [{id, from, subject, date, snippet, body, read?, via?}]（via=采集来源邮箱服务商名）
   - mail_accounts:  [{id, provider:'qq'|'163'|'outlook'|'gmail'|'icloud', email, credential}]（邮箱采集绑定账户，凭证仅存本机）
   - config:         {textApi, imageApi, emailApi}（各含 url/key/model...）
   - cloud_backup_at:string（上次云备份时间，仅本机记录）
   - seeded:         boolean（是否已初始化种子数据）
------------------------------------------------------- */
/* ---------- 首次打开：不预置任何示例数据，改为让用户选身份 ---------- */
// 以前这里会灌一批「开发者示例」（接入 API / 联调 / 内测清单），
// 对新用户来说像别人的项目，反而不知道从哪开始。改成选身份 → 自动铺一套真实清单。
function seedIfEmpty(){
  if(ls.get('seeded', false)) return;
  ls.set('seeded', true);
  setTimeout(()=>{ if(!ls.get('persona','')) openPersona(); }, 700);
}

/* =================================================================== TOP BAR */
const REPEATS = {daily:'每天', weekly:'每周', monthly:'每月'};
// 计算下一个周期日：monthly 按日钳制到月末（31 号在 2 月变 28/29 号）
function nextOccur(dateStr, repeat){
  const p=dateStr.split('-').map(Number);
  if(repeat==='daily')  return fmtDate(new Date(p[0], p[1]-1, p[2]+1));
  if(repeat==='weekly') return fmtDate(new Date(p[0], p[1]-1, p[2]+7));
  if(repeat==='monthly'){
    const base=new Date(p[0], p[1], 1); // 下个月
    const last=new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
    base.setDate(Math.min(p[2], last));
    return fmtDate(base);
  }
  return dateStr;
}
// 重复提醒的有效到期日：把起始日向后推进到 >= today 的最近一期
function effRemDate(r, today){
  if(!r.repeat || r.repeat==='none' || !r.date) return r.date;
  let d=r.date, guard=0;
  while(d<today && guard++<500) d=nextOccur(d, r.repeat);
  return d;
}
// 提醒到期日比较键：无时间的视为当天末尾（23:59）
function remSortKey(r, today){ return (effRemDate(r, today)||'9999-99-99')+' '+(r.time||'23:59'); }
function remOverdue(r, today, hhmm){
  if(r.done) return false;
  const ed = effRemDate(r, today) || '';
  if(ed < today) return true;
  return ed===today && !!r.time && !!hhmm && r.time<=hhmm;
}
function renderReminders(){
  const all = ls.get('reminders', []);
  const today = todayStr(), hhmm = remHHMM();
  const open = all.filter(r=>!r.done).sort((a,b)=> remSortKey(a,today)<remSortKey(b,today)?-1:1);
  const bar = $('#remindersBar');
  if(open.length===0){ bar.innerHTML='<span class="rem-empty">暂无待处理提醒 ✓</span>'; return; }
  bar.innerHTML = open.slice(0, LIMITS.topReminders).map(r=>{
    const past = remOverdue(r, today, hhmm);
    const ed = effRemDate(r, today) || '';
    const isOverdue = ed < today;
    const rep = r.repeat && r.repeat!=='none' ? REPEATS[r.repeat] : '';
    const label = isOverdue ? '逾期 '+fmtMD(ed)
      : past ? '已到点'
      : relDay(ed)+(r.time? ' '+r.time : '');
    return `<div class="rem-chip ${past?'overdue':''}">
      <span class="rem-date">${label}</span>

// 收集最近一周的工作上下文（每日任务 + 看板 + 未完成提醒），供「拆解任务 / 生成周报」使用
function weekCtx(){
  const from=shiftDay(-6), now=todayStr();
  const dt=ls.get('daily_tasks',[]).filter(t=>t.date>=from&&t.date<=now);
  const parts=[];
  dt.filter(t=>t.done).forEach(t=>parts.push('[已完成] '+t.title+'（'+relDay(t.date)+'）'));
  dt.filter(t=>!t.done).forEach(t=>parts.push('[未完成] '+t.title+'（'+relDay(t.date)+'）'));
  ls.get('kanban',[]).forEach(c=>{
    if(c.col==='done') parts.push('[已完成] '+c.title);
    else if(c.col==='doing') parts.push('[进行中] '+c.title);
  });
  ls.get('reminders',[]).filter(r=>!r.done).slice(0,8).forEach(r=>parts.push('[待办] '+r.text));
  return parts.slice(0,40).join('\n') || '（最近一周暂无工作记录）';
}

async function genText(overrideQ){
  const cfg = ls.get('config',{}).textApi||{};
  // overrideQ：AI 一键动作传入的完整 prompt；按钮/快捷键触发时收到的是 event 对象，回退到输入框内容
  const q = (typeof overrideQ==='string'? overrideQ : $('#textInput').value).trim();
  if(!q){ toast('请输入内容'); return; }
  const btn=$('#btnTextGen'), out=$('#textResult');
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> 生成中';
  let ans='';
  try{
    if(!cfg.url || !cfg.key){
      // 没有自己的 API：走平台免密钥试用（每日免费额度），用户不用配置任何东西
      ans = await genTextTrial(q, out);
      aiUse('text');
      const h0 = ls.get('text_history',[]); h0.push({id:rid(), q, a:ans, t:todayStr()}); ls.set('text_history',h0.slice(-LIMITS.textMax));
      renderTextHist();
      return;
    }
    // 流式优先（OpenAI 兼容 SSE）：增量渲染到结果区；代理不支持时自动回退 JSON
    const res = await apiFetch(cfg, {body:{model:cfg.model||'gpt-4o-mini', messages:[{role:'user',content:q}], temperature:0.7, stream:true}, timeout:120000});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const ctype = res.headers.get('content-type')||'';
    if(ctype.includes('text/event-stream') && res.body){
      out.textContent='';
      const reader=res.body.getReader(), dec=new TextDecoder();
      let buf='';
      for(;;){
        const {done, value} = await reader.read();
        if(done) break;
        buf += dec.decode(value, {stream:true});
        const lines = buf.split('\n');
        buf = lines.pop(); // 末尾可能是半行，留到下一轮
        for(const line of lines){
          const s=line.trim();
          if(!s.startsWith('data:')) continue;
          const data=s.slice(5).trim();
          if(data==='[DONE]' || !data) continue;
          try{
            const j=JSON.parse(data);
            const delta=j?.choices?.[0]?.delta?.content ?? j?.choices?.[0]?.message?.content ?? '';
            if(delta){ ans+=delta; out.textContent=ans; }
          }catch(err){ /* 忽略心跳/注释行 */ }
        }
      }
      if(!ans) throw new Error('流式响应为空（检查接口是否兼容 OpenAI 格式）');
    }else{
      const j = await res.json();
      ans = j?.choices?.[0]?.message?.content || j?.output?.text || (typeof j?.response==='string'?j.response:null);
      if(!ans) ans = JSON.stringify(j);
      out.textContent = ans;
    }
    const h = ls.get('text_history',[]); h.push({id:rid(), q, a:ans, t:todayStr()}); ls.set('text_history',h.slice(-LIMITS.textMax));
    renderTextHist();
    aiUse('text'); // 计量埋点：自己配 API 的调用也计入，后续付费墙有数据可用
  }catch(e){
    if(e.message!=='__demo__'){
      if(ans){ // 流式中途失败：保留已生成部分
        out.textContent = ans + '\n\n[响应中断] '+apiErrMsg(e);
        const h = ls.get('text_history',[]); h.push({id:rid(), q, a:ans+'（响应中断）', t:todayStr()}); ls.set('text_history',h.slice(-LIMITS.textMax));
        renderTextHist(); toast('生成中断，已保留部分结果');
      }else{
        out.textContent='调用失败：'+apiErrMsg(e)+'（检查设置中的 API 配置）';
      }
    }
  }
  finally{ btn.disabled=false; btn.innerHTML=ICON_GEN+'生成文本'; }
}

async function genImage(){
  const cfg = ls.get('config',{}).imageApi||{};
  const p = $('#imgPrompt').value.trim();
  if(!p){ toast('请输入图像描述'); return; }
  const btn=$('#btnImgGen'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';

    if(!cfg.url || !cfg.key){

    }

    if(!res.ok) throw new Error('HTTP '+res.status);
    const j = await res.json();
    const item = j?.data?.[0] || {};
    let url = item.url || (item.b64_json? 'data:image/png;base64,'+item.b64_json : null);
    if(!url) throw new Error('响应中无图像地址');
    url = await compressImage(url);
    $('#imgStage').innerHTML='<img src="'+url+'" style="cursor:pointer">';
    $('#imgStage').querySelector('img').onclick=()=>openLightbox(url);
    const h = ls.get('image_history',[]); h.push({id:rid(), prompt:p, url, t:todayStr()}); ls.set('image_history',h.slice(-LIMITS.imgMax));
    renderImgGrid();
    aiUse('image');
  }catch(e){ if(e.message!=='__demo__'){ $('#imgStage').innerHTML='<span class="muted-tip" style="border:none;background:transparent">生成失败：'+esc(apiErrMsg(e))+'</span>'; } }
  finally{ btn.disabled=false; btn.innerHTML=ICON_IMG+'生成'; }
}
function compressImage(src){
  return new Promise((resolve)=>{
    const img=new Image();
    img.onload=()=>{ let w=img.width,h=img.height; if(w>800){ h=Math.round(h*800/w); w=800; }
      try{ const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); resolve(c.toDataURL('image/jpeg',0.82)); }
      catch(e){ resolve(src); } };
    img.onerror=()=>resolve(src); img.src=src;
  });
}

// 分享卡片：Canvas 纯本地绘制（720x960，朋友圈竖版比例），无任何外部依赖
function truncStr(s,n){ return s.length>n? s.slice(0,n-1)+'…' : s; }
function roundRectPath(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawShareCard(mode){
  const W=720, H=960;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const ctx=c.getContext('2d');
  // 背景：飞书蓝渐变 + 两处装饰光斑
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#245bdb'); g.addColorStop(1,'#12255c');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.07; ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.arc(640,140,190,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(60,900,150,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  const F='-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';
  const st=weeklyStats();
  const range=st.days[0].slice(5).replace('-','/')+' - '+st.days[6].slice(5).replace('-','/');
  ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font='500 26px '+F;
  ctx.fillText('布谷鸟 Cuckoo 工作台',60,100);
  ctx.textAlign='right'; ctx.fillText(range,W-60,100); ctx.textAlign='left';
  ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fillRect(60,130,W-120,2);
  if(mode==='week'){
    ctx.fillStyle='#ffffff'; ctx.font='700 44px '+F;
    ctx.fillText('我的效率周报',60,225);
    ctx.font='700 116px '+F;
    ctx.fillText(String(st.weekTotal),60,375);
    ctx.font='500 32px '+F; ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.fillText('本周完成的任务 · 继续保持',60,435);
    // 本周完成清单（去重取前 6 条）
    const list=ls.get('daily_tasks',[]).filter(t=>t.done&&t.date>=st.days[0]&&t.date<=st.days[6]);
    const titles=[...new Set(list.map(t=>t.title))].slice(0,6);
    ctx.font='500 30px '+F; ctx.fillStyle='rgba(255,255,255,.92)';
    if(titles.length) titles.forEach((t,i)=>ctx.fillText('✓  '+truncStr(t,15),60,530+i*54));
    else { ctx.fillStyle='rgba(255,255,255,.6)'; ctx.fillText('还没有完成记录，从一件小事开始吧',60,530); }
    // 连击徽标
    if(st.streak>0){
      ctx.fillStyle='rgba(255,255,255,.16)';
      roundRectPath(ctx,60,870-70,300,64,32); ctx.fill();
      ctx.fillStyle='#ffffff'; ctx.font='600 30px '+F;
      ctx.fillText('🔥 连续 '+st.streak+' 天',86,912-70);
    }
  }else{
    ctx.fillStyle='#ffffff'; ctx.font='700 44px '+F;
    ctx.fillText('打卡成就',60,225);
    ctx.font='700 116px '+F;
    ctx.fillText('🔥 '+st.streak,60,375);
    ctx.font='500 32px '+F; ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.fillText('连续打卡天数 · 每天进步一点点',60,435);
    // 最近 7 天柱状图
    const max=Math.max(1,...st.counts), bw=52, gap=28, x0=60, baseY=760;
    st.counts.forEach((n,i)=>{
      const h=n? Math.max(14, Math.round(n/max*170)) : 8;
      const x=x0+i*(bw+gap);
      ctx.fillStyle=n? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.22)';
      roundRectPath(ctx,x,baseY-h,bw,h,10); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font='500 24px '+F;
      ctx.textAlign='center';
      ctx.fillText('日一二三四五六'[new Date(st.days[i].replace(/-/g,'/')).getDay()],x+bw/2,baseY+42);
      if(n) ctx.fillText(String(n),x+bw/2,baseY-h-14);
      ctx.textAlign='left';
    });
  }
  // 底部落款（裂变入口）
  ctx.fillStyle='rgba(255,255,255,.65)'; ctx.font='500 26px '+F;
  ctx.fillText('免费使用 → '+INVITE_URL.replace(/^https?:\/\//,'').replace(/\/\?.*$/,''),60,906);
  return c.toDataURL('image/png');
}

/* =================================================================== CENTER TOP: Daily tasks */
let dailySel = 'today';
const DAILY_TABS = [
  {id:'today', label:'今天', off:0},
  {id:'d1', label:'明天', off:1},
  {id:'d2', label:'后天', off:2},
  {id:'d3', label:'大后天', off:3},
  {id:'all', label:'全部', off:null}
];
function dailyDateFor(id){ const t=DAILY_TABS.find(x=>x.id===id); return t&&t.off!=null? shiftDay(t.off): null; }
const PRIO = {high:{name:'高', color:'#ef4444'}, mid:{name:'中', color:'#f59e0b'}, low:{name:'低', color:'#3b82f6'}};
/* ---------- 连击打卡 + 本周完成统计 ---------- */
// 统计口径：按任务日期统计每天完成数；连击=从今天（或昨天）往前连续有完成的天数
// weeklyStats 同时供 renderDailyStats 与分享卡片使用
function weeklyStats(){
  const list=ls.get('daily_tasks',[]);
  const days=[]; for(let i=6;i>=0;i--) days.push(shiftDay(-i));
  const counts=days.map(d=>list.filter(t=>t.done&&t.date===d).length);
  const weekTotal=counts.reduce((a,b)=>a+b,0);
  let streak=0, i=6;
  if(counts[6]===0) i=5; // 今天还没完成不打断连击，从昨天起算
  for(;i>=0;i--){ if(counts[i]>0) streak++; else break; }
  return {days, counts, weekTotal, streak};
}
function renderDailyStats(){
  const st=weeklyStats();
  const max=Math.max(1,...st.counts);
  const bars=st.days.map((d,j)=>{
    const h=st.counts[j]? Math.max(5, Math.round(st.counts[j]/max*16)) : 3;
    const wd='日一二三四五六'[new Date(d.replace(/-/g,'/')).getDay()];
    return '<span class="ds-col" title="'+relDay(d)+' 完成 '+st.counts[j]+' 件"><i class="'+(st.counts[j]?'on':'')+'" style="height:'+h+'px"></i><em>'+wd+'</em></span>';
  }).join('');
  $('#dailyStats').innerHTML=
    '<span class="ds-streak">'+(st.streak>0? '🔥 连续 '+st.streak+' 天' : '🌱 完成第一件事，点亮打卡')+'</span>'
    +'<span class="ds-bars">'+bars+'</span>'
    +'<span class="ds-total">本周 '+st.weekTotal+' 件</span>'
    +'<button class="ic-btn ds-share" data-share title="生成分享卡片">'+ICON_SHARE+'</button>';
  const sb=$('#dailyStats').querySelector('[data-share]');
  if(sb) sb.onclick=openShareCard;
}
function renderDaily(){
  $('#dailyTabs').innerHTML = DAILY_TABS.map(t=>`<button class="daily-tab ${t.id===dailySel?'active':''}" data-id="${t.id}">${t.label}</button>`).join('');
  $('#dailyTabs').querySelectorAll('.daily-tab').forEach(b=>b.onclick=()=>{ dailySel=b.dataset.id; renderDaily(); });
  renderDailyStats();
  const list = ls.get('daily_tasks', []);
  const dsel = dailyDateFor(dailySel);
  const shown = dsel? list.filter(t=>t.date===dsel) : list;
  if(shown.length===0){ $('#dailyScroll').innerHTML='<div class="daily-empty">这一天还没有安排。点右上角「+ 添加」写一件小事，或在右边「记一笔」直接说。</div>'; return; }
  $('#dailyScroll').innerHTML = shown.map(t=>{
    const pr = PRIO[t.prio];
    return `<div class="daily-card ${t.done?'done':''}">
      <div class="dc-top">
        <button class="daily-check ${t.done?'on':''}" data-id="${t.id}" aria-label="切换任务完成">${CHK}</button>
        <span class="dc-title">${esc(t.title)}</span>
        ${pr? `<span class="prio-dot" style="background:${pr.color}" title="${pr.name}优先级"></span>`:''}
      </div>
          <div class="dc-bot">
            <span class="dc-date">${relDay(t.date)}</span>
            <button class="ic-btn" data-edit="${t.id}" title="编辑">${ICON_EDIT}</button>
            <button class="dc-del" data-id="${t.id}" title="删除">×</button>
          </div>
    </div>`;
  }).join('');
  $('#dailyScroll').querySelectorAll('.daily-check').forEach(b=>b.onclick=()=>toggleDone('daily_tasks', b.dataset.id, renderDaily));
  $('#dailyScroll').querySelectorAll('.dc-del').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id, item=ls.get('daily_tasks',[]).find(x=>x.id===id);
    if(!item) return;
    removeWithUndo('daily_tasks', item, {label:'任务', rerender:renderDaily});
  });
  $('#dailyScroll').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editDaily(b.dataset.edit));
}
function editDaily(id){
  const t=ls.get('daily_tasks',[]).find(x=>x.id===id); if(!t)return;
  formModal({
    title:'编辑任务', saveText:'保存',
    fields:[
      {id:'dyTitle', label:'任务内容', value:t.title},
      {id:'dyDate', label:'日期', type:'date', value:t.date},
      {id:'dyPrio', label:'优先级', type:'select', value:t.prio||'none',
        options:[{value:'none',name:'无'},{value:'high',name:'高'},{value:'mid',name:'中'},{value:'low',name:'低'}]}
    ],
    onSave:([title,date,prio])=>{
      if(!title.trim()){ toast('任务内容不能为空'); return false; }
      const list=ls.get('daily_tasks',[]); const it=list.find(x=>x.id===id);
      if(it){ it.title=title.trim(); it.date=date||it.date; it.prio=prio==='none'?'':prio; }
      ls.set('daily_tasks',list); renderDaily();
    }
  });
}
function addDaily(){
  const def = dailySel==='all'? todayStr() : (dailyDateFor(dailySel)||todayStr());
  formModal({
    title:'添加一件事', saveText:'添加',
    fields:[
      {id:'dyTitle', label:'任务内容', placeholder:'例如：完成接口联调'},
      {id:'dyDate', label:'日期', type:'date', value:def},
      {id:'dyPrio', label:'优先级', type:'select', value:'none',
        options:[{value:'none',name:'无'},{value:'high',name:'高'},{value:'mid',name:'中'},{value:'low',name:'低'}]}
    ],
    onSave:([title,date,prio])=>{
      if(!title.trim()){ toast('任务内容不能为空'); return false; }
      // 自然语言识别：标题含「明天/周X/X号」等时自动改写日期
      const parsed=parseNL(title.trim());
      if(parsed && parsed.date){
        title=parsed.title; date=parsed.date;
        toast('已识别：'+relDay(parsed.date));
      }
      const list=ls.get('daily_tasks',[]);
      list.push({id:rid(), title:title.trim(), date:date||todayStr(), prio:prio==='none'?'':prio, done:false});
      ls.set('daily_tasks',list); renderDaily();
    }
  });
}

/* =================================================================== CENTER BOTTOM: Vertical Kanban */
const KCOLS=[{id:'todo',name:'未开始',color:'#94a3b8'},{id:'doing',name:'进行中',color:'#0ea5e9'},{id:'done',name:'已完成',color:'#16a34a'}];
let kanbanSearch='', kanbanActiveCols=new Set(); // 空集=显示全部列
function ringSVG(pct){
  const r=22,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg width="56" height="56" viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--border)" stroke-width="6"/>
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--primary)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 28 28)"/>
    <text x="28" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text)">${Math.round(pct)}%</text></svg>`;
}
function renderKanban(){
  const cards = ls.get('kanban', []);
  // 收起状态下也要有信息：标题右侧一行摘要
  const ksum=$('#kSum');
  if(ksum){
    const doing=cards.filter(c=>c.col==='doing').length;
    const done=cards.filter(c=>c.col==='done').length;
    ksum.textContent = cards.length? ('进行中 '+doing+' · 完成 '+done+'/'+cards.length) : '还没有项目';
  }
  // P2-3：关键词搜索（按标题）
  let view = cards;
  const q = kanbanSearch.trim().toLowerCase();
  if(q) view = view.filter(c=> c.title.toLowerCase().includes(q));
  // KPI 始终基于全部卡片（不受筛选影响，提供全局概览）
  const total = cards.length;
  const done = cards.filter(c=>c.col==='done').length;
  const pct = total? done/total*100 : 0;
  $('#kpiRing').innerHTML = ringSVG(pct);
  $('#kpiBars').innerHTML = KCOLS.map(k=>{
    const n=cards.filter(c=>c.col===k.id).length; const w = total? n/total*100 : 0;
    return `<div class="bar-row"><span class="bl">${k.name}</span><span class="bar-track"><span class="bar-fill" style="width:${w}%;background:${k.color}"></span></span><span class="bn">${n}</span></div>`;
  }).join('');
  // P2-3：列筛选按钮
  $('#kbFilters').innerHTML = KCOLS.map(k=>
    `<button class="kb-filter ${kanbanActiveCols.has(k.id)?'on':''}" data-col="${k.id}">${k.name}</button>`
  ).join('');
  $('#kbFilters').querySelectorAll('.kb-filter').forEach(b=>b.onclick=()=>{
    if(kanbanActiveCols.has(b.dataset.col)) kanbanActiveCols.delete(b.dataset.col);
    else kanbanActiveCols.add(b.dataset.col);
    renderKanban();
  });
  // 渲染看板列：仅显示激活的列（空集=全部显示）
  const showCols = kanbanActiveCols.size? kanbanActiveCols : new Set(KCOLS.map(k=>k.id));
  $('#kanban').innerHTML = KCOLS.filter(k=>showCols.has(k.id)).map(k=>{
    const origIdx = KCOLS.findIndex(x=>x.id===k.id); // 原始索引（用于上移/下移按钮判断，列筛选时仍正确）
    const list = view.filter(c=>c.col===k.id);
    const upBtn = origIdx>0? `<button data-id="{ID}" data-dir="up" title="上移"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg></button>`:'';
    const downBtn = origIdx<KCOLS.length-1? `<button data-id="{ID}" data-dir="down" title="下移"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>`:'';
    return `<div class="ksec" data-col="${k.id}">
      <div class="ksh"><span class="dot" style="background:${k.color}"></span>${k.name}<span class="kc">${list.length}</span>
        <button class="kadd2" data-col="${k.id}">+ 添加</button></div>
      <div class="ks-cards">${list.length?list.map(c=>{
        let u = origIdx>0? upBtn.replace('{ID}',c.id):'';
        let d = origIdx<KCOLS.length-1? downBtn.replace('{ID}',c.id):'';
        const editBtn=`<button class="ic-btn" data-edit="${c.id}" title="编辑">${ICON_EDIT}</button>`;
        const delBtn=`<button class="ic-btn danger" data-del="${c.id}" title="删除">${ICON_TRASH}</button>`;
        const dueOverdue = c.due && c.due<todayStr() && c.col!=='done';
        const dueChip = c.due? `<span class="kdue ${dueOverdue?'overdue':''}" title="${dueOverdue?'已逾期':'截止'} ${c.due}">${dueOverdue?'逾期 ':''}${fmtMD(c.due)}</span>`:'';
        return `<div class="kcard" draggable="true" data-id="${c.id}"><span class="kt">${esc(c.title)}</span>${dueChip}<span class="kact">${u}${d}${editBtn}${delBtn}</span></div>`;
      }).join(''):'<div class="kempty">这一列还空着，点「＋」加一个</div>'}</div>
    </div>`;
  }).join('');
  $('#kanban').querySelectorAll('.kact button[data-dir]').forEach(b=>b.onclick=()=>moveCard(b.dataset.id,b.dataset.dir));
  $('#kanban').querySelectorAll('.kact button[data-edit]').forEach(b=>b.onclick=()=>openKanbanModal(null,b.dataset.edit));
  $('#kanban').querySelectorAll('.kact button[data-del]').forEach(b=>b.onclick=()=>delCard(b.dataset.del));
  $('#kanban').querySelectorAll('.kadd2').forEach(b=>b.onclick=()=>openKanbanModal(b.dataset.col));
  // 拖拽：卡片拖到其他列换状态；放到某张卡片前可插入排序（触屏仍可用上移/下移按钮）
  $('#kanban').querySelectorAll('.kcard').forEach(el=>{
    el.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', el.dataset.id);
      e.dataTransfer.effectAllowed='move';
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', ()=>el.classList.remove('dragging'));
  });
  $('#kanban').querySelectorAll('.ksec').forEach(sec=>{
    sec.addEventListener('dragover', e=>{ e.preventDefault(); sec.classList.add('drag-over'); });
    sec.addEventListener('dragleave', e=>{ if(!sec.contains(e.relatedTarget)) sec.classList.remove('drag-over'); });
    sec.addEventListener('drop', e=>{
      e.preventDefault(); sec.classList.remove('drag-over');
      const id=e.dataTransfer.getData('text/plain'); if(!id) return;
      const cards=ls.get('kanban',[]);
      const i=cards.findIndex(x=>x.id===id); if(i<0) return;
      const moved=cards.splice(i,1)[0];
      moved.col=sec.dataset.col;
      const target=e.target.closest('.kcard');
      if(target && target.dataset.id!==id){
        const ti=cards.findIndex(x=>x.id===target.dataset.id);
        cards.splice(ti<0?cards.length:ti, 0, moved);
      }else{
        cards.push(moved);
      }
      ls.set('kanban',cards); renderKanban();
    });
  });
  adaptScroll();
}
function moveCard(id, dir){
  const cards=ls.get('kanban',[]); const c=cards.find(x=>x.id===id); if(!c)return;
  const i=KCOLS.findIndex(k=>k.id===c.col); const ni=dir==='up'?i-1:i+1;
  if(ni<0||ni>=KCOLS.length)return; c.col=KCOLS[ni].id; ls.set('kanban',cards); renderKanban();
}
function openKanbanModal(col, editId){
  const c = editId? ls.get('kanban',[]).find(x=>x.id===editId):null;
  formModal({
    title:(c?'编辑':'添加')+'看板任务', saveText:c?'保存':'添加',
    fields:[
      {id:'kTitle', label:'任务标题', value:c?c.title:'', placeholder:'例如：联调邮件接口'},
      {id:'kCol', label:'状态', type:'select', value:c?c.col:(col||'todo'), options:KCOLS.map(k=>({value:k.id, name:k.name}))},
      {id:'kDue', label:'截止日期（可选）', type:'date', value:c?(c.due||''):''}
    ],
    onSave:([t,kCol,kDue])=>{
      if(!t.trim()){ toast('任务标题不能为空'); return false; }
      const cards=ls.get('kanban',[]);
      if(c){ c.title=t.trim(); c.col=kCol; c.due=kDue||''; }
      else cards.push({id:rid(), title:t.trim(), col:kCol, due:kDue||''});
      ls.set('kanban',cards); renderKanban();
    }
  });
}
function delCard(id){
  const c=ls.get('kanban',[]).find(x=>x.id===id);
  if(!c) return;
  removeWithUndo('kanban', c, {label:'看板任务', rerender:renderKanban});
}

/* =================================================================== RIGHT TOP: Calendar */
let calY, calM;
function renderCalendar(){
  const now=new Date(); calY=calY??now.getFullYear(); calM=calM??now.getMonth();
  $('#calMonth').textContent = calY+'年'+(calM+1)+'月';
  const events = ls.get('calendar_events', []);
  const evDates = new Set(events.map(e=>e.date));
  const dailyDates = new Set(ls.get('daily_tasks',[]).filter(x=>!x.done).map(x=>x.date));
  const remDates = new Set(ls.get('reminders',[]).filter(x=>!x.done).map(x=>x.date));
  const first = new Date(calY, calM, 1); const startW = first.getDay();
  const daysInM = new Date(calY, calM+1, 0).getDate();
  const daysInPrev = new Date(calY, calM, 0).getDate();
  const t = todayStr();
  let cells=''; const wd=['日','一','二','三','四','五','六'];
  cells += wd.map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<startW;i++){ const d=daysInPrev-startW+1+i; cells+=`<div class="cal-day other">${d}</div>`; }
  for(let d=1;d<=daysInM;d++){
    const ds=fmtDate(new Date(calY, calM, d));
    const isToday = ds===t;
    // 日历标记点：日程(主色) / 未完成每日任务(橙) / 未完成提醒(红)
    const dots = (evDates.has(ds)?'<span class="dot"></span>':'')
               + (dailyDates.has(ds)?'<span class="dot d-daily"></span>':'')
               + (remDates.has(ds)?'<span class="dot d-rem"></span>':'');
    cells+=`<div class="cal-day ${isToday?'today':''}" data-date="${ds}">${d}${dots?'<span class="dots">'+dots+'</span>':''}</div>`;
  }
  const tail = (7-((startW+daysInM)%7))%7;
  for(let i=1;i<=tail;i++){ cells+=`<div class="cal-day other">${i}</div>`; }
  $('#calGrid').innerHTML=cells;
  $('#calGrid').querySelectorAll('.cal-day[data-date]').forEach(c=>c.onclick=()=>openEventModal(c.dataset.date));
}

/* =================================================================== RIGHT BOTTOM: Email */
let mailSearch='', mailUnreadOnly=false;
async function renderMail(force){
  const cfg = ls.get('config',{}).emailApi||{};
  if(force && cfg.url){
    try{
      const res = await apiFetch(cfg, {});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const j = await res.json();
      const arr = Array.isArray(j)? j : (j.emails||j.data||j.list||[]);
      const list = arr.map(e=>({id:e.id||e.message_id||rid(), from:e.from||e.sender||'未知', subject:e.subject||e.title||'(无主题)', date:e.date||e.time||e.received_at||'', snippet:e.snippet||e.preview||(e.body?String(e.body).slice(0,80):''), body:e.body||e.content||''}));
      if(list.length){ ls.set('email_cache',list); }
    }catch(e){ toast('邮件刷新失败，显示缓存内容'); }
  }
  const list = ls.get('email_cache', []).slice().sort((a,b)=> String(b.date||'').localeCompare(String(a.date||''))); // 最新在前
  // P2-2：未读筛选 + 关键词搜索（可组合）
  let view = list;
  if(mailUnreadOnly) view = view.filter(m=>!m.read);
  const q = mailSearch.trim().toLowerCase();
  if(q) view = view.filter(m=> (m.from+' '+m.subject+' '+(m.snippet||'')+' '+(m.body||'')).toLowerCase().includes(q));
  updateMailFilterUI();
  $('#mailList').innerHTML = view.length? view.map(m=>
    `<div class="mail-item ${m.read?'read':'unread'}" data-id="${m.id}">
      <div class="m-top"><span class="m-unread"></span><span class="m-from">${esc(m.from)}</span>${m.via?`<span class="m-via">${esc(m.via)}</span>`:''}<span class="m-date">${esc(m.date)}</span></div>
      <div class="m-sub">${esc(m.subject)}</div>
      <div class="m-snip">${esc(m.snippet)}</div>
      <div class="mail-actions"><button class="ic-btn danger" data-del="${m.id}" title="删除">${ICON_TRASH}</button></div>
    </div>`).join('') : (list.length? '<div class="mail-empty">没有找到匹配的邮件</div>' : '<div class="kempty">还没有邮件，去「设置」绑定邮箱就会自动收进来</div>');
  $('#mailList').querySelectorAll('.mail-item').forEach(it=>it.onclick=()=>{
    const m=list.find(x=>x.id===it.dataset.id); if(!m)return;
    const wasUnread=!m.read;
    m.read=true; ls.set('email_cache',list); if(wasUnread){ if(mailUnreadOnly) renderMail(false); else { it.classList.replace('unread','read'); updateMailFilterUI(); } }
    openModal(`<h3>邮件详情<span class="x">×</span></h3>
      <div class="field"><label>发件人</label><div>${esc(m.from)}</div></div>
      <div class="field"><label>主题</label><div>${esc(m.subject)}</div></div>
      <div class="field"><label>时间</label><div>${esc(m.date)}</div></div>
      <div class="field"><label>正文</label><div style="white-space:pre-wrap;font-size:14px;line-height:1.6">${esc(m.body||m.snippet)}</div></div>`);
  });
  $('#mailList').querySelectorAll('[data-del]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const id=b.dataset.del, item=list.find(x=>x.id===id);
    if(!item) return;
    removeWithUndo('email_cache', item, {label:'邮件', rerender:()=>renderMail(false)});
  });
}
function updateMailFilterUI(){
  const n = ls.get('email_cache', []).filter(m=>!m.read).length;
  const btn = $('#btnMailUnread');
  if(btn){ btn.textContent = '未读'+(n? ' '+n : ''); btn.classList.toggle('on', mailUnreadOnly); }
}

$('#overlay').addEventListener('click', e=>{ if(e.target===$('#overlay')) closeModal(); });
// 弹窗关闭按钮统一委托：所有 .x 元素点击即关闭，各弹窗无需单独绑定
$('#drawer').addEventListener('click', e=>{ if(e.target.classList && e.target.classList.contains('x')) closeModal(); });
function openEventModal(date){
  const evs = ls.get('calendar_events', []).filter(e=>e.date===date);
  openModal(`<h3>${date} 的日程<span class="x">×</span></h3>
    <div id="evList">${evs.length?evs.map(e=>`<div class="hist-item" style="display:flex;justify-content:space-between;align-items:center"><span>${esc(e.title)}</span><button class="btn btn-sm btn-ghost" data-evdate="${esc(date)}" data-evtitle="${esc(e.title)}">删除</button></div>`).join(''):'<div class="kempty">当天暂无安排</div>'}</div>
    <div class="field" style="margin-top:10px"><label>新增日程</label><input id="evTitle" placeholder="例如：与设计评审"></div>
    <button class="btn btn-primary" style="width:100%" onclick="addEvent('${date}')">添加</button>`);
  // 用 data 属性 + 事件绑定代替内联 onclick，日程标题含引号时不会破坏 JS 字符串
  $('#evList').querySelectorAll('[data-evtitle]').forEach(b=>b.onclick=()=>delEvent(b.getAttribute('data-evdate'), b.getAttribute('data-evtitle')));
}
function addEvent(date){ const t=$('#evTitle').value.trim(); if(!t)return; const evs=ls.get('calendar_events',[]); evs.push({date,title:t}); ls.set('calendar_events',evs); closeModal(); renderCalendar(); }
function delEvent(date,title){
  const ev=ls.get('calendar_events',[]).find(e=>e.date===date&&e.title===title);
  if(!ev) return;
  removeWithUndo('calendar_events', ev, {
    label:'日程', rerender:renderCalendar,
    match:x=>x.date===ev.date && x.title===ev.title, // 日程无 id，按日期+标题定位
    afterDelete:()=>openEventModal(date), // 删除后刷新当日日程列表
    afterRestore:()=>{ if($('#overlay').classList.contains('show') && $('#evList')) openEventModal(date); }
  });
}
function openReminderManager(){
  const today = todayStr();
  const list = ls.get('reminders',[]).slice().sort((a,b)=> remSortKey(a,today)<remSortKey(b,today)?-1:1);
  const overdue = r => remOverdue(r, today, remHHMM());
  const item = r => {
    const ed = effRemDate(r, today) || r.date;
    return `<div class="hist-item" style="display:flex;align-items:center;gap:8px">
      <button class="daily-check ${r.done?'on':''}" style="width:18px;height:18px;flex-shrink:0" data-done="${r.id}" aria-label="切换提醒完成">${CHK}</button>
      <span style="flex:1;min-width:0;${r.done?'text-decoration:line-through;':''}color:${overdue(r)?'var(--danger)':'var(--text)'}">
        <span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.text)}${r.repeat&&r.repeat!=='none'?' <span class="ac-badge">'+(REPEATS[r.repeat]||'')+'</span>':''}</span>
        <small style="color:var(--muted)">${fmtMD(ed)}${r.time?' '+r.time:''}${overdue(r)?' · 已到点':(ed<today?' · 逾期':'')}</small>
