<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anliways | 个人主页</title>
    
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- 核心引入：Markdown 实时转换器 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        /* ==================== 1. 全局基础与现代防抖样式 ==================== */
        html { scrollbar-gutter: stable; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body {
            background-color: #f5f5f7; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #1d1d1f;
            display: flex;
            flex-direction: column; /* 升级为纵向排列，支撑通栏底栏 */
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 0; /* 移除外层死 padding，由组件自己控制间距 */
        }
        body.has-navbar { 
            justify-content: flex-start; /* 有导航栏时靠顶排列，允许内容顺畅下滑 */
        }
        .hidden { display: none !important; }

        /* ==================== 2. 丝滑顶部导航栏（全屏铺满） ==================== */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 64px;
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05); display: flex; justify-content: center; align-items: center;
            z-index: 1000; transform: translateY(-100%); opacity: 0; pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .top-navbar.nav-visible { transform: translateY(0); opacity: 1; pointer-events: auto; }
        .nav-container { width: 100%; max-width: 1200px; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; }
        .nav-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .brand-avatar { width: 28px; height: 28px; background: #1d1d1f; color: #ffffff; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .brand-name { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
        .nav-links { display: flex; gap: 32px; }
        .nav-link { font-size: 14px; color: #86868b; text-decoration: none; font-weight: 500; cursor: pointer; padding: 4px 0; transition: color 0.2s ease; }
        .nav-link:hover, .nav-link.active { color: #0071e3; }

        /* ==================== 3. 视图 1：个人主页菜单卡片 ==================== */
        .profile-card { 
            background: #ffffff; 
            width: calc(100% - 40px); max-width: 420px; 
            padding: 40px 32px; border-radius: 24px; 
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04); text-align: center; 
            animation: fadeIn 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            margin: 40px 20px;
        }
        .avatar-placeholder { width: 80px; height: 80px; background: #1d1d1f; color: #ffffff; font-size: 32px; font-weight: 600; display: flex; align-items: center; justify-content: center; border-radius: 50%; margin: 0 auto 24px auto; }
        .name { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
        .bio { font-size: 15px; color: #86868b; margin-bottom: 36px; }
        .links-container { display: flex; flex-direction: column; gap: 14px; }
        .link-item { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: #f5f5f7; border: 1px solid transparent; border-radius: 14px; text-decoration: none; color: #1d1d1f; font-size: 15px; font-weight: 500; transition: all 0.2s ease; cursor: pointer; }
        .link-item:hover { background: #ffffff; border-color: #d2d2d7; transform: scale(1.01); }
        .link-left { display: flex; align-items: center; gap: 12px; }
        .link-left i { font-size: 20px; color: #515154; }
        .arrow-icon { font-size: 16px; color: #86868b; transition: transform 0.2s ease; }
        .link-item:hover .arrow-icon { transform: translateX(3px); }

        /* ==================== 4. 视图 2：项目橱窗 ==================== */
        .showcase-card { 
            background: #ffffff; 
            width: calc(100% - 40px); max-width: 580px; 
            padding: 40px 32px; border-radius: 24px; 
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04); 
            animation: fadeIn 0.4s cubic-bezier(0.25, 1, 0.5, 1); 
            margin-top: 104px; margin-bottom: 50px;
        }
        .card-header { display: flex; align-items: center; margin-bottom: 32px; position: relative; }
        .back-btn { position: absolute; left: 0; color: #86868b; font-size: 24px; cursor: pointer; }
        .back-btn:hover { color: #1d1d1f; }
        .page-title { font-size: 20px; font-weight: 600; width: 100%; text-align: center; }
        .projects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .grid-item { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 12px; background: #f5f5f7; border: 1px solid transparent; border-radius: 20px; text-decoration: none; color: #1d1d1f; cursor: pointer; transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1); }
        .grid-item:hover { background: #ffffff; border-color: #e5e5ea; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06); transform: translateY(-4px); }
        .grid-icon { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; background: #ffffff; color: #1d1d1f; border-radius: 16px; font-size: 26px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 12px; transition: transform 0.25s ease, background 0.25s ease; }
        .grid-item:hover .grid-icon { background: #f5f5f7; transform: scale(1.05); }
        .grid-title { font-size: 13px; font-weight: 500; color: #1d1d1f; }

        /* ==================== 5. 视图 3：博客文章双栏布局 ==================== */
        .blog-split-container { 
            display: flex; 
            width: 100%; max-width: 1140px; 
            padding: 0 20px; gap: 28px; 
            animation: fadeIn 0.4s cubic-bezier(0.25, 1, 0.5, 1); 
            margin-top: 104px; margin-bottom: 50px; 
            align-items: flex-start; 
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.99); } to { opacity: 1; transform: scale(1); } }
        .blog-sidebar { flex: 0 0 320px; background: #ffffff; padding: 24px; border-radius: 24px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04); display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 150px); overflow-y: auto; }
        .blog-sidebar-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #1d1d1f; padding-left: 4px; }
        .blog-sidebar-item { display: flex; flex-direction: column; gap: 6px; padding: 16px 20px; background: #f5f5f7; border: 1px solid transparent; border-radius: 14px; cursor: pointer; transition: all 0.2s ease; text-align: left; }
        .blog-sidebar-item:hover { background: #ffffff; border-color: #d2d2d7; }
        .blog-sidebar-item.active { background: #ffffff; border-color: #0071e3; box-shadow: 0 4px 12px rgba(0, 113, 227, 0.08); }
        .blog-sidebar-item.active .sidebar-item-title { color: #0071e3; }
        .sidebar-item-title { font-size: 15px; font-weight: 600; color: #1d1d1f; line-height: 1.4; }
        .sidebar-item-date { font-size: 12px; color: #86868b; }
        
        .blog-preview-panel { flex: 1; background: #ffffff; padding: 40px; border-radius: 24px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04); min-height: 450px; display: flex; flex-direction: column; max-height: calc(100vh - 150px); overflow-y: auto; }
        .preview-title { font-size: 26px; font-weight: 700; line-height: 1.3; margin-bottom: 12px; letter-spacing: -0.5px; }
        .preview-meta { display: flex; gap: 16px; font-size: 13px; color: #86868b; margin-bottom: 24px; border-bottom: 1px solid #f5f5f7; padding-bottom: 16px; }
        .preview-meta-item { display: flex; align-items: center; gap: 4px; }
        
        /* 正文 Markdown 样式 */
        .preview-body { font-size: 16px; color: #333336; line-height: 1.7; flex: 1; }
        .preview-body p { margin-bottom: 16px; }
        .preview-body h1, .preview-body h2, .preview-body h3 { color: #1d1d1f; margin: 28px 0 14px 0; font-weight: 600; }
        .preview-body h1 { font-size: 22px; }
        .preview-body h2 { font-size: 20px; }
        .preview-body h3 { font-size: 18px; }
        .preview-body ul, .preview-body ol { padding-left: 22px; margin-bottom: 18px; }
        .preview-body li { margin-bottom: 8px; }
        .preview-body code { background: #f5f5f7; padding: 3px 6px; border-radius: 6px; font-size: 14px; font-family: monospace; }
        .preview-body pre { background: #f5f5f7; padding: 16px; border-radius: 12px; overflow-x: auto; margin-bottom: 18px; }
        .preview-body pre code { background: transparent; padding: 0; font-size: 13px; }
        .preview-body img { max-width: 100%; border-radius: 12px; margin: 16px 0; }
        .preview-body blockquote { border-left: 4px solid #d2d2d7; padding-left: 16px; color: #86868b; font-style: italic; margin-bottom: 18px; }

        /* ==================== 6. 终极进化：全屏通栏级苹果风底栏 ==================== */
        .site-footer {
            width: 100%;
            background: transparent;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding: 30px 0;
            margin-top: auto; /* 核心魔法：当页面内容不足一屏时，自动将底栏推至屏幕最底端 */
            display: flex;
            justify-content: center;
            animation: fadeIn 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .footer-container {
            width: 100%;
            max-width: 1200px; /* 完美对齐顶部导航栏 */
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #86868b;
        }
        .footer-left { font-weight: 400; }
        .footer-right { display: flex; gap: 24px; }
        .footer-right a { color: #86868b; text-decoration: none; transition: color 0.2s ease; }
        .footer-right a:hover { color: #0071e3; }

        /* ==================== 7. 响应式布局 ==================== */
        @media (max-width: 850px) {
            .blog-split-container { flex-direction: column; align-items: stretch; gap: 20px; margin-top: 84px; }
            .blog-sidebar { flex: none; max-height: 240px; }
            .blog-preview-panel { padding: 28px 24px; max-height: none; }
            .preview-title { font-size: 22px; }
            .footer-container { flex-direction: column; gap: 12px; text-align: center; padding: 0 24px; }
        }
        @media (max-width: 640px) { .nav-container { padding: 0 24px; } .nav-links { gap: 20px; } .brand-name { display: none; } }
        @media (max-width: 500px) { .projects-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <!-- 顶部导航（全屏通栏） -->
    <nav id="top-navbar" class="top-navbar">
        <div class="nav-container">
            <div class="nav-brand" onclick="toggleView('profile')">
                <span class="brand-avatar">an</span>
                <span class="brand-name">anliways</span>
            </div>
            <div class="nav-links">
                <a id="nav-link-profile" class="nav-link" onclick="toggleView('profile')">主页菜单</a>
                <a id="nav-link-projects" class="nav-link" onclick="toggleView('projects')">项目橱窗</a>
                <a id="nav-link-blog" class="nav-link" onclick="toggleView('blog')">博客文章</a>
            </div>
        </div>
    </nav>

    <!-- 视图 1：起始页 -->
    <div id="view-profile" class="profile-card">
        <div class="avatar-placeholder">an</div>
        <h1 class="name">anliways</h1>
        <p class="bio">个人开发者 · 媒体人</p>
        
        <div class="links-container">
            <div class="link-item" onclick="toggleView('blog')">
                <div class="link-left">
                    <i class="ri-book-read-line"></i>
                    <span>博客文章 (Blog)</span>
                </div>
                <i class="ri-arrow-right-s-line arrow-icon"></i>
            </div>
            <div class="link-item" onclick="toggleView('projects')">
                <div class="link-left">
                    <i class="ri-layout-grid-fill"></i>
                    <span>项目橱窗 (Projects)</span>
                </div>
                <i class="ri-arrow-right-s-line arrow-icon"></i>
            </div>
            <a href="mailto:anliways8@gmail.com" class="link-item">
                <div class="link-left">
                    <i class="ri-mail-line"></i>
                    <span>anliways8@gmail.com</span>
                </div>
                <i class="ri-arrow-right-s-line arrow-icon"></i>
            </a>
            <div class="link-item" onclick="copyWeChat()">
                <div class="link-left">
                    <i class="ri-wechat-2-line"></i>
                    <span>微信：anliways</span>
                </div>
                <i class="ri-file-copy-line arrow-icon" style="font-size: 14px;"></i>
            </div>
        </div>
    </div>

    <!-- 视图 2：项目橱窗 -->
    <div id="view-projects" class="showcase-card hidden">
        <div class="card-header">
            <a class="back-btn" onclick="toggleView('profile')" title="返回主页"><i class="ri-arrow-left-s-line"></i></a>
            <h1 class="page-title">项目橱窗</h1>
        </div>
        <div class="projects-grid">
            <a href="https://telegra.ph" target="_blank" class="grid-item">
                <div class="grid-icon"><i class="ri-article-line"></i></div>
                <span class="grid-title">媒体博客</span>
            </a>
            <a href="https://github.com" target="_blank" class="grid-item">
                <div class="grid-icon"><i class="ri-github-fill"></i></div>
                <span class="grid-title">开源主页</span>
            </a>
            <a href="#" class="grid-item"><div class="grid-icon"><i class="ri-terminal-box-line"></i></div><span class="grid-title">效率脚本</span></a>
            <a href="#" class="grid-item"><div class="grid-icon"><i class="ri-image-edit-line"></i></div><span class="grid-title">设计资源</span></a>
            <a href="#" class="grid-item"><div class="grid-icon"><i class="ri-cloud-line"></i></div><span class="grid-title">私有网盘</span></a>
            <a href="#" class="grid-item"><div class="grid-icon"><i class="ri-code-s-slash-line"></i></div><span class="grid-title">API 服务</span></a>
            <a href="#" class="grid-item"><div class="grid-icon"><i class="ri-database-2-line"></i></div><span class="grid-title">数据监控</span></a>
            <a href="#" class="grid-item"><div class="grid-icon"><i class="ri-robot-2-line"></i></div><span class="grid-title">Bot 部署</span></a>
            <a href="#" class="grid-item"><div class="grid-icon"><i class="ri-camera-lens-line"></i></div><span class="grid-title">摄影集</span></a>
        </div>
    </div>

    <!-- 视图 3：博客文章双栏布局 -->
    <div id="view-blog" class="blog-split-container hidden">
        <div class="blog-sidebar">
            <div class="blog-sidebar-title">文章列表</div>
            <div id="sidebar-list-container"></div>
        </div>
        <div class="blog-preview-panel">
            <h2 id="pm-title" class="preview-title">加载中...</h2>
            <div class="preview-meta">
                <div class="preview-meta-item"><i class="ri-calendar-todo-line"></i><span id="pm-date">-</span></div>
                <div class="preview-meta-item"><i class="ri-user-line"></i><span id="pm-author">-</span></div>
            </div>
            <div id="pm-body" class="preview-body"></div>
        </div>
    </div>

    <!-- 全局独立全屏通栏底栏（起始页自动隐藏，其余页面无缝同步渲染） -->
    <footer id="global-footer" class="site-footer hidden">
        <div class="footer-container">
            <div class="footer-left">Copyright © 2026 anliways. 保留所有权利。</div>
            <div class="footer-right">
                <a href="#" onclick="toggleView('profile')">返回首页</a>
                <a href="https://github.com" target="_blank">GitHub</a>
                <a href="mailto:anliways8@gmail.com">联系我</a>
            </div>
        </div>
    </footer>

    <script>
        let blogData = [];

        function copyWeChat() {
            const wechatId = "anliways";
            navigator.clipboard.writeText(wechatId).then(() => {
                alert("微信号 '" + wechatId + "' 已成功复制到剪贴板！");
            }).catch(err => { alert("微信号为: " + wechatId); });
        }

        function initBlogSidebar() {
            const container = document.getElementById('sidebar-list-container');
            container.innerHTML = '';
            blogData.forEach((article) => {
                const item = document.createElement('div');
                item.className = 'blog-sidebar-item';
                item.id = `sidebar-${article.id}`;
                item.onclick = () => selectArticle(article.id);
                item.innerHTML = `
                    <span class="sidebar-item-title">${article.title}</span>
                    <span class="sidebar-item-date">${article.date}</span>
                `;
                container.appendChild(item);
            });
        }

        function selectArticle(articleId) {
            document.querySelectorAll('.blog-sidebar-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.getElementById(`sidebar-${articleId}`);
            if (activeItem) activeItem.classList.add('active');

            const article = blogData.find(b => b.id === articleId);
            if (article) {
                document.getElementById('pm-title').innerText = article.title;
                document.getElementById('pm-date').innerText = article.date;
                document.getElementById('pm-author').innerText = article.author || "anliways";
                
                document.getElementById('pm-body').innerHTML = "<p style='color: #86868b;'>正在加载内容...</p>";
                
                fetch(`posts/${articleId}.md`)
                    .then(res => {
                        if (!res.ok) throw new Error();
                        return res.text();
                    })
                    .then(mdText => {
                        document.getElementById('pm-body').innerHTML = marked.parse(mdText);
                    })
                    .catch(() => {
                        document.getElementById('pm-body').innerHTML = "<p style='color: #86868b;'>文章正文内容加载失败，请检查 Markdown 文件是否存在。</p>";
                    });
            }
        }

        function toggleView(target) {
            const profileView = document.getElementById('view-profile');
            const projectsView = document.getElementById('view-projects');
            const blogView = document.getElementById('view-blog');
            const topNavbar = document.getElementById('top-navbar');
            const globalFooter = document.getElementById('global-footer');

            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));

            profileView.classList.add('hidden');
            projectsView.classList.add('hidden');
            blogView.classList.add('hidden');

            if (target === 'projects') {
                projectsView.classList.remove('hidden');
                topNavbar.classList.add('nav-visible'); 
                globalFooter.classList.remove('hidden'); // 显示独立底栏
                document.body.classList.add('has-navbar');
                document.getElementById('nav-link-projects').classList.add('active');
                document.title = "anliways | 项目橱窗";
                window.scrollTo({ top: 0, behavior: 'smooth' });
                
            } else if (target === 'blog') {
                blogView.classList.remove('hidden');
                topNavbar.classList.add('nav-visible'); 
                globalFooter.classList.remove('hidden'); // 显示独立底栏
                document.body.classList.add('has-navbar');
                document.getElementById('nav-link-blog').classList.add('active');
                document.title = "anliways | 博客文章";
                
                fetch('posts.json')
                    .then(res => res.json())
                    .then(data => {
                        blogData = data;
                        initBlogSidebar();
                        if (blogData.length > 0) selectArticle(blogData[0].id);
                    })
                    .catch(err => {
                        document.getElementById('pm-title').innerText = "加载失败";
                        document.getElementById('pm-body').innerHTML = "<p>未能成功获取文章列表，请检查 posts.json 文件配置。</p>";
                    });
                window.scrollTo({ top: 0, behavior: 'smooth' });
                
            } else {
                profileView.classList.remove('hidden');
                topNavbar.classList.remove('nav-visible'); 
                globalFooter.classList.add('hidden'); // 起始页完美隐藏底栏
                document.body.classList.remove('has-navbar');
                document.title = "anliways | 个人主页";
            }
        }
    </script>
</body>
</html>
